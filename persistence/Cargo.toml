[package]
name = "persistence"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "persistence"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework + WebSocket
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

# ScyllaDB driver
scylla = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Concurrent cache
dashmap = "6"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
thiserror = "2"

# Environment / config
dotenvy = "0.15"

# UUID
uuid = { version = "1", features = ["v4"] }

# Futures utilities
futures = "0.3"

# Convenient error boxing for main()
anyhow = "1"
