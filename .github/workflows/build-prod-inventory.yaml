name: "Build Production Image: inventory"

on:
  push:
    tags:
      - "inventory-v*"

jobs:
  extract-version:
    name: Extract version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Extract version
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#inventory-}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: Build inventory (prod)
    needs: extract-version
    uses: ./.github/workflows/_build-push.yaml
    with:
      service_name: inventory
      context_path: inventory
      dockerfile_path: inventory/docker/Dockerfile
      image_name: harbor.dyingstar-game.space/dyingstar/inventory
      image_tag: ${{ needs.extract-version.outputs.version }}
      additional_tags: latest
      chart_name: service-inventory
      trigger_preprod_deploy: false
    secrets:
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
