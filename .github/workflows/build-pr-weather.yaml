name: "PR Build Check: weather"

on:
  pull_request:
    paths:
      - "weather/**"
      - "resourcesDynamic/data/system/**"

jobs:
  build:
    name: Build weather (PR check)
    uses: ./.github/workflows/_build-push.yaml
    with:
      service_name: weather
      # Context = services/ root: the image embeds resourcesDynamic/data/system/
      # (weather/docker/Dockerfile.dockerignore trims the rest).
      context_path: .
      dockerfile_path: weather/docker/Dockerfile
      image_name: local/weather
      image_tag: pr-check
      push: false

  # The weather's tests, the check that the committed derived climate and golden samples are still what
  # resourcesDynamic/data/system/tarsis.json gives included: a change of that file fails here until they are
  # exported again (the game copies them).
  test:
    name: Test weather
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weather
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: weather
      - name: cargo test
        run: cargo test --workspace --locked
