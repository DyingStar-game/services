name: "PR Build Check: npc"

on:
  pull_request:
    paths:
      - "npc/**"

jobs:
  build:
    name: Build npc (PR check)
    uses: ./.github/workflows/_build-push.yaml
    with:
      service_name: npc
      context_path: npc
      dockerfile_path: npc/docker/Dockerfile
      image_name: local/npc
      image_tag: pr-check
      push: false

  test:
    name: Test npc
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: npc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: npc
      - name: cargo test
        env:
          # The database tests create one database per test on this server.
          NPC_TEST_DATABASE_URL: postgres://test:test@localhost:5432/postgres
        run: cargo test --locked
