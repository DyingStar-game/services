name: "Build & Deploy to Preprod: market"

on:
  push:
    branches:
      - develop
    paths:
      - "market/**"

jobs:
  build:
    name: Build market (preprod)
    uses: ./.github/workflows/_build-push.yaml
    with:
      service_name: market
      context_path: market
      dockerfile_path: market/docker/Dockerfile
      image_name: harbor.dyingstar-game.space/dyingstar/market
      image_tag: develop
      chart_name: service-market
      trigger_preprod_deploy: true
    secrets:
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
      KUBERNETES_REPO_TOKEN: ${{ secrets.KUBERNETES_REPO_TOKEN }}
