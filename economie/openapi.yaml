        '403': { $ref: '#/components/responses/ServiceForbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Keycloak access token (RS256, validated against the realm JWKS). The player id
        is the `sub` claim. Dev only (`AUTH_DEV_BYPASS=true`): `X-Player-Id`,
        `X-Player-Name`, `X-Player-Roles` headers may replace the token.
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Keycloak service-account access token (client_credentials, RS256, validated
        against the realm JWKS). `azp` must be an allowed client
        (`INTERNAL_SERVICE_CLIENTS`) and `aud` must contain `economie-api`; each route
        then needs its capability role. Dev only (`INTERNAL_DEV_BYPASS=true`): the
        legacy `X-Internal-Key` header is accepted instead.

  parameters:
    playerId:
      name: playerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    npcId:
      name: npcId
      in: path
      required: true
      schema: { type: string, format: uuid }
    corporationId:
      name: corporationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    politicalEntityId:
      name: entityId
      in: path
      required: true
      schema: { type: string, format: uuid }
    role:
      name: role
      in: path
      required: true
      description: Treasury role the salary applies to
      schema: { $ref: '#/components/schemas/CorporationRole' }
    currencyQuery:
      name: currency
      in: query
      description: Currency to pay in (defaults to `credits`)
      schema: { type: string, maxLength: 16, default: credits }
    days:
      name: days
      in: query
      description: Length of the analytics window and time series, in days
      schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
    top:
      name: top
      in: query
      description: Number of richest holders returned per ranking
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    from:
      name: from
      in: query
      description: Start of the report period (ISO date/time, inclusive)
      schema: { type: string, format: date-time }
    to:
      name: to
      in: query
      description: End of the report period (ISO date/time, inclusive)
      schema: { type: string, format: date-time }

    offset:
      in: query
      name: offset
      schema:
        default: 0
        minimum: 0
        type: integer
  responses:
    ValidationError:
      description: Invalid body, query or path parameters (`VALIDATION_ERROR`) or malformed JSON (`INVALID_JSON`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid player token / service token (`UNAUTHORIZED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: >
        Missing `economie:treasury:manage` / not a corporation member (`FORBIDDEN`, `NOT_CORPORATION_MEMBER`),
        account is locked/frozen (`ACCOUNT_LOCKED`), or donations disabled (`DONATIONS_DISABLED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found (`NOT_FOUND`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: State conflict (`CONFLICT`, `INSUFFICIENT_FUNDS`, `DUPLICATE_EXTERNAL_ID`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceForbidden:
      description: >
        The service token is not from an allowed client (`SERVICE_FORBIDDEN`) or the
        service account lacks the route's capability role (`FORBIDDEN`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error, message, status]
      properties:
        error:
          type: string
          description: Machine-readable code
          examples: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, SERVICE_FORBIDDEN, ACCOUNT_LOCKED, INSUFFICIENT_FUNDS, DUPLICATE_EXTERNAL_ID, NOT_CORPORATION_MEMBER, NOT_FOUND, INTERNAL_ERROR]
        message: { type: string }
        status: { type: integer }

    # ── Enums ──
    AccountHolderType:
      type: string
      enum: [player, npc, corporation, political, system]
    AccountStatus:
      type: string
      enum: [active, locked, frozen]
    TransactionType:
      type: string
      enum: [transfer, deposit, withdrawal, tax, fee, mission_reward, salary, prime, donation, corporation_fund, issuance, system]
    CorporationRole:
      type: string
      enum: [leader, treasurer, member]
    PoliticalMemberRole:
      type: string
      enum: [head, treasurer, member]
    PoliticalMemberHolderType:
      type: string
      enum: [player, npc]
    TaxDebtorType:
      type: string
      enum: [player, npc, corporation]
    TaxType:
      type: string
      enum: [corporate_tax, income_tax]
    TaxDebtStatus:
      type: string
      enum: [due, paid, cancelled]

    # ── Accounts & movements ──
    Account:
      type: object
      required: [id, holderType, holderId, currency, balance, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        holderType: { $ref: '#/components/schemas/AccountHolderType' }
        holderId: { type: string, format: uuid, description: Keycloak subject for players, Social `corporationId` for corporations, reserved key for the system vault }
        currency: { type: string, default: credits }
        balance: { type: integer, description: Integer minor units, never negative }
        status: { $ref: '#/components/schemas/AccountStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Transaction:
      type: object
      required: [id, type, currency, amount, taxAmount, feeAmount, createdAt]
      properties:
        id: { type: integer, format: int64 }
        fromAccountId: { type: [string, 'null'], format: uuid }
        toAccountId: { type: [string, 'null'], format: uuid }
        type: { $ref: '#/components/schemas/TransactionType' }
        currency: { type: string }
        amount: { type: integer, description: Amount credited to `toAccountId` }
        taxAmount: { type: integer, description: Tax collected from the payer and routed to `details.taxTo` }
        feeAmount: { type: integer }
        externalId: { type: [string, 'null'], description: Idempotency key unique when present }
        reference: { type: [string, 'null'] }
        caller: { type: [string, 'null'], description: Keycloak client id of the calling service; null for player-driven movements }
        details:
          oneOf:
            - type: object
              description: Free-form; `taxTo` records where the collected tax went (`system` or an account id)
            - type: 'null'
        createdAt: { type: string, format: date-time }

    MovementResult:
      type: object
      required: [transaction, amount, taxAmount]
      properties:
        transaction: { $ref: '#/components/schemas/Transaction' }
        amount: { type: integer }
        taxAmount: { type: integer }
        fromBalance: { type: integer, description: New payer balance after the movement }
        toBalance: { type: integer, description: New receiver balance after the movement }

    TransferBody:
      type: object
      required: [toPlayerId, amount]
      properties:
        toPlayerId: { type: string, format: uuid, description: Must differ from the caller }
        amount: { type: integer, minimum: 1, description: Integer minor units — what the receiver gets; the payer also pays the tax }
        memo: { type: string, maxLength: 256 }

    MovementBody:
      type: object
      required: [amount]
      properties:
        amount: { type: integer, minimum: 1 }
        currency: { type: string, maxLength: 16, default: credits }
        reference: { type: string, maxLength: 128 }
        externalId: { type: string, minLength: 1, maxLength: 128, description: Idempotency key; replaying a movement returns `409 DUPLICATE_EXTERNAL_ID` }
        type:
          description: Overrides the default type (default `deposit` on credit, `withdrawal` on debit)
          oneOf:
            - { type: string }
            - { $ref: '#/components/schemas/TransactionType' }

    DonationBody:
      type: object
      required: [amount]
      properties:
        amount: { type: integer, minimum: 1 }
        memo: { type: string, maxLength: 256 }

    # ── Corporations ──
    CorporationMember:
      type: object
      required: [corporationId, playerId, holderType, role, joinedAt]
      properties:
        corporationId: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        holderType:
          type: string
          enum: [player, npc]
          description: Whether the member is a player or an NPC
        role: { $ref: '#/components/schemas/CorporationRole' }
        joinedAt: { type: string, format: date-time }

    MemberRoleBody:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/CorporationRole' }
        holderType:
          type: string
          enum: [player, npc]
          default: player
          description: Whether the member is a player or an NPC (drives which wallet receives payouts)

    CorporationSettings:
      type: object
      required: [corporationId, taxRateBps, allowDonations, updatedAt]
      properties:
        corporationId: { type: string, format: uuid }
        taxRateBps: { type: integer, minimum: 0, maximum: 10000, description: Internal tax on donations, in basis points; stays in the corporation }
        allowDonations: { type: boolean }
        updatedAt: { type: string, format: date-time }

    CorporationSettingsBody:
      type: object
      minProperties: 1
      properties:
        taxRateBps: { type: integer, minimum: 0, maximum: 10000 }
        allowDonations: { type: boolean }

    CorporationReport:
      type: object
      required: [corporationId, totals, byType]
      properties:
        corporationId: { type: string, format: uuid }
        from: { type: [string, 'null'], format: date-time }
        to: { type: [string, 'null'], format: date-time }
        totals:
          type: array
          description: Inflow/outflow per currency (outflow includes taxes paid by the corporation)
          items:
            type: object
            required: [currency, inflow, outflow]
            properties:
              currency: { type: string }
              inflow: { type: integer }
              outflow: { type: integer }
        byType:
          type: array
          description: Breakdown of the same flows by transaction type and currency
          items:
            type: object
            required: [type, currency, count, inflow, outflow]
            properties:
              type: { $ref: '#/components/schemas/TransactionType' }
              currency: { type: string }
              count: { type: integer }
              inflow: { type: integer }
              outflow: { type: integer }

    # ── Payroll ──
    CorporationSalaryRole:
      type: object
      required: [corporationId, role, currency, amount, enabled, updatedAt]
      properties:
        corporationId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/CorporationRole' }
        currency: { type: string, default: credits }
        amount: { type: integer, minimum: 0, description: Integer minor units paid per period }
        enabled: { type: boolean }
        updatedAt: { type: string, format: date-time }

    CorporationMemberSalary:
      type: object
      required: [corporationId, playerId, currency, amount, enabled, updatedAt]
      properties:
        corporationId: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        currency: { type: string, default: credits }
        amount: { type: integer, minimum: 0, description: Overrides the role default }
        enabled: { type: boolean }
        updatedAt: { type: string, format: date-time }

    SalaryBody:
      type: object
      required: [amount]
      properties:
        amount: { type: integer, minimum: 0, description: Integer minor units; 0 disables the payout }
        currency: { type: string, maxLength: 16, default: credits }
        enabled: { type: boolean, default: true }

    PayrollResult:
      type: object
      required: [corporationId, currency, paid, skipped, total]
      properties:
        corporationId: { type: string, format: uuid }
        currency: { type: string }
        paid:
          type: array
          items:
            type: object
            required: [playerId, amount, source]
            properties:
              playerId: { type: string, format: uuid }
              amount: { type: integer }
              source:
                type: string
                enum: [member, role]
                description: Whether the amount came from a per-member override or the role default
        skipped:
          type: array
          description: Members with no enabled salary
          items: { type: string, format: uuid }
        total: { type: integer, description: Total debited from the treasury }

    PrimeBody:
      type: object
      required: [amount]
      properties:
        amount: { type: integer, minimum: 1, description: Integer minor units }
        currency: { type: string, maxLength: 16, default: credits }
        memo: { type: string, maxLength: 256 }

    PrimeResult:
      type: object
      required: [transaction, treasuryBalance, memberBalance]
      properties:
        transaction: { $ref: '#/components/schemas/Transaction' }
        treasuryBalance: { type: integer }
        memberBalance: { type: integer }

    # ── Admin analytics ──
    EconomyStats:
      type: object
      required: [moneySupply, transactions, richestPlayers, richestNpcs, richestCorporations, series]
      properties:
        moneySupply:
          type: array
          description: Total balance and account count per currency
          items:
            type: object
            required: [currency, total, accounts]
            properties:
              currency: { type: string }
              total: { type: integer }
              accounts: { type: integer }
        transactions:
          type: object
          required: [total, period]
          properties:
            total: { $ref: '#/components/schemas/TransactionTotals' }
            period: { $ref: '#/components/schemas/TransactionTotals' }
        richestPlayers:
          type: array
          description: Holder ids only; the admin UI resolves display names through the Social service
          items: { $ref: '#/components/schemas/RichestHolder' }
        richestNpcs:
          type: array
          items: { $ref: '#/components/schemas/RichestHolder' }
        richestCorporations:
          type: array
          items: { $ref: '#/components/schemas/RichestHolder' }
        series:
          type: array
          description: Daily transaction count, volume and tax collected
          items:
            type: object
            required: [date, transactions, volume, tax]
            properties:
              date: { type: string, description: 'Day in YYYY-MM-DD' }
              transactions: { type: integer }
              volume: { type: integer }
              tax: { type: integer }

    TransactionTotals:
      type: object
      required: [count, volume, tax, fee]
      properties:
        count: { type: integer }
        volume: { type: integer, description: Sum of credited amounts }
        tax: { type: integer }
        fee: { type: integer }

    RichestHolder:
      type: object
      required: [holderId, currency, balance]
      properties:
        holderId: { type: string, format: uuid, description: Player id (Keycloak subject) or corporation id }
        currency: { type: string }
        balance: { type: integer }
        displayName: { type: [string, 'null'], description: Player pseudonym resolved through Social (null when unknown or for corporations) }

    AdminPlayer:
      type: object
      required: [playerId, displayName, entityType, accounts]
      properties:
        playerId: { type: string, format: uuid }
        displayName: { type: string }
        entityType: { type: string, enum: [player, npc] }
        accounts:
          type: array
          items: { $ref: '#/components/schemas/Account' }

    # ── Politics, taxes & minting ──
    PoliticalSettings:
      type: object
      required: [entityId, corporateTaxBps, incomeTaxBps, allowMinting, mintCeiling, lastAssessedAt, updatedAt]
      properties:
        entityId: { type: string, format: uuid }
        corporateTaxBps: { type: integer, minimum: 0, maximum: 10000, description: Corporate tax on the corporation treasury balance }
        incomeTaxBps: { type: integer, minimum: 0, maximum: 10000, description: Income tax on citizen income since the last assessment }
        allowMinting: { type: boolean, description: Whether the entity may create currency (countries/federations only, enforced upstream) }
        mintCeiling: { type: integer, description: Absolute ceiling of a single mint; 0 = no ceiling }
        lastAssessedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }

    PoliticalMember:
      type: object
      required: [entityId, playerId, holderType, role, joinedAt]
      properties:
        entityId: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        holderType: { $ref: '#/components/schemas/PoliticalMemberHolderType' }
        role: { $ref: '#/components/schemas/PoliticalMemberRole' }
        joinedAt: { type: string, format: date-time }

    PoliticalTaxDebt:
      type: object
      required: [id, assessmentId, entityId, debtorType, debtorId, currency, amount, taxType, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        assessmentId: { type: string, format: uuid, description: Groups every debt booked by one assessment run }
        entityId: { type: string, format: uuid }
        debtorType: { $ref: '#/components/schemas/TaxDebtorType' }
        debtorId: { type: string, format: uuid }
        currency: { type: string }
        amount: { type: integer, description: Integer minor units }
        taxType: { $ref: '#/components/schemas/TaxType' }
        status: { $ref: '#/components/schemas/TaxDebtStatus' }
        details: { type: [object, 'null'], additionalProperties: true, description: Assessment base and rate used }
        createdAt: { type: string, format: date-time }
        paidAt: { type: [string, 'null'], format: date-time }

    AssessmentResult:
      type: object
      required: [entityId, assessmentId, currency, since, corporateDebts, incomeDebts, booked]
      properties:
        entityId: { type: string, format: uuid }
        assessmentId: { type: string, format: uuid }
        currency: { type: string }
        since: { type: string, format: date-time, description: Start of the income window used }
        corporateDebts: { type: integer }
        incomeDebts: { type: integer }
        booked: { type: integer }

    TaxPaymentResult:
      type: object
      required: [debtorType, debtorId, paid, paidTotal, remaining]
      properties:
        debtorType: { $ref: '#/components/schemas/TaxDebtorType' }
        debtorId: { type: string, format: uuid }
        paid:
          type: array
          items:
            type: object
            required: [debtId, entityId, amount]
            properties:
              debtId: { type: integer, format: int64 }
              entityId: { type: string, format: uuid }
              amount: { type: integer }
        paidTotal: { type: integer }
        remaining: { type: integer, description: Debts still due after this payment }
    CorporationSalaries:
      properties:
        corporationId:
          format: uuid
          type: string
        limit:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        memberOverrides:
          items:
            $ref: '#/components/schemas/CorporationMemberSalary'
          type: array
        memberOverridesTotal:
          minimum: 0
          type: integer
        offset:
          default: 0
          minimum: 0
          type: integer
        roleDefaults:
          items:
            $ref: '#/components/schemas/CorporationSalaryRole'
          type: array
        total:
          minimum: 0
          type: integer
      required:
      - corporationId
      - roleDefaults
      - memberOverrides
      - memberOverridesTotal
      - total
      - limit
      - offset
      type: object
    TransactionPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Transaction'
          type: array
        limit:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        offset:
          default: 0
          minimum: 0
          type: integer
        total:
          minimum: 0
          type: integer
      required:
      - items
      - total
      - limit
      - offset
      type: object
    PoliticalTaxDebtPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/PoliticalTaxDebt'
          type: array
        limit:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        offset:
          default: 0
          minimum: 0
          type: integer
        total:
          minimum: 0
          type: integer
      required:
      - items
      - total
      - limit
      - offset
      type: object
    CorporationMemberPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CorporationMember'
          type: array
        limit:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        offset:
          default: 0
          minimum: 0
          type: integer
        total:
          minimum: 0
          type: integer
      required:
      - items
      - total
      - limit
      - offset
      type: object
    AdminPlayerPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AdminPlayer'
          type: array
        limit:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        offset:
          default: 0
          minimum: 0
          type: integer
        total:
          minimum: 0
          type: integer
      required:
      - items
      - total
      - limit
      - offset
      type: object
    PoliticalMemberPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/PoliticalMember'
          type: array
        limit:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        offset:
          default: 0
          minimum: 0
          type: integer
        total:
          minimum: 0
          type: integer
      required:
      - items
      - total
      - limit
      - offset
      type: object