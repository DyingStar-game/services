openapi: 3.1.0
info:
  title: DyingStar Economie API
  version: 0.1.0
  description: >
    Economy API of DyingStar: per-player and per-corporation wallet accounts, direct
    transfers with automatic taxes, corporate treasuries and financial reports.

    Three kinds of callers:

    * **Players** send a Keycloak JWT (`Authorization: Bearer`). The player id is
      the `sub` claim. With `AUTH_DEV_BYPASS=true` (never in production) the
      `X-Player-Id` / `X-Player-Name` / `X-Player-Roles` headers are accepted instead.
    * **The game server** and trusted services authenticate with a Keycloak
      service-account token (`client_credentials`, `Authorization: Bearer`) whose
      `azp` is an allowed client and whose `aud` targets `economie-api`. Each
      `/api/internal/*` route requires a capability role (e.g.
      `economie:wallet:credit`). Membership of corporations and their roles are
      pushed through this channel (mirrors the Social service). Dev only
      (`INTERNAL_DEV_BYPASS=true`): the legacy `X-Internal-Key` header is accepted.

    Amounts are integer minor units (crédits). A holder owns one account per currency
    (`credits` is the universal currency). Every error is
    `{ "error": "CODE", "message": "...", "status": 4xx }`.


    Language: every response honours the standard `Accept-Language: fr|en` header
    (default `en`) for error messages; zod validation messages stay in English.
    Technical identifiers (codes, kind names, fields, `{params}`) are never translated.
servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: public
    description: Unauthenticated endpoints
  - name: me
    description: The authenticated player's own wallet and ledger
  - name: transfers
    description: Direct player-to-player transfers (automatic tax)
  - name: corporations
    description: Corporate treasuries, members, donations, payroll and financial reports
  - name: politics
    description: Political treasuries, tax debts and currency issuance
  - name: admin
    description: Admin/moderation dashboard analytics (requires role `moderator` at least)
  - name: internal
    description: Game-server integration (Keycloak service accounts, capability roles)

security:
  - bearerAuth: []

paths:
  # ── Public ─────────────────────────────────────────────────────────────────
  /api/health:
    get:
      tags: [public]
      summary: Liveness check
      responses:
        '200':
          description: API is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: economie }
                  version: { type: string, example: 0.1.0 }

  /openapi.yaml:
    get:
      tags: [public]
      summary: This service's OpenAPI document
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 document (YAML)
          content:
            application/yaml:
              schema: { type: string }

  /api/openapi.yaml:
    get:
      tags: [public]
      summary: This service's OpenAPI document (alias under /api)
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 document (YAML)
          content:
            application/yaml:
              schema: { type: string }

  # ── Me (own wallet) ────────────────────────────────────────────────────────
  /api/me/wallet:
    get:
      tags: [me]
      summary: All wallet accounts of the caller (one per currency, `credits` auto-created)
      responses:
        '200':
          description: Wallet accounts
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/me/wallet/transactions:
    get:
      tags: [me]
      summary: Ledger of the caller across all currencies
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Transactions, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransactionPage'}
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Transfers ──────────────────────────────────────────────────────────────
  /api/transfers:
    post:
      tags: [transfers]
      summary: Direct credits transfer to another player (automatic tax, payer side)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferBody' }
      responses:
        '201':
          description: Transfer recorded (a tax may have been collected)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovementResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Insufficient balance or already recorded `externalId` (`INSUFFICIENT_FUNDS` / `DUPLICATE_EXTERNAL_ID`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── Corporations ───────────────────────────────────────────────────────────
  /api/corporations/{corporationId}/wallet:
    get:
      tags: [corporations]
      summary: Treasury accounts (member only)
      parameters:
        - $ref: '#/components/parameters/corporationId'
      responses:
        '200':
          description: Corporation treasury accounts
          content:
            application/json:
              schema:
                type: object
                required: [corporationId, accounts]
                properties:
                  corporationId: { type: string, format: uuid }
                  accounts:
                    type: array
                    items: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Not a member of this corporation (`NOT_CORPORATION_MEMBER`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/corporations/{corporationId}/wallet/transactions:
    get:
      tags: [corporations]
      summary: Treasury ledger (member only)
      parameters:
        - $ref: '#/components/parameters/corporationId'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Corporation ledger across currencies
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransactionPage'}
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/corporations/{corporationId}/members:
    get:
      tags: [corporations]
      summary: Treasury staff and roles (member only)
      parameters:
        - $ref: '#/components/parameters/corporationId'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Corporation treasury members
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CorporationMemberPage'}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/corporations/{corporationId}/report:
    get:
      tags: [corporations]
      summary: Financial report (economie:treasury:manage)
      parameters:
        - $ref: '#/components/parameters/corporationId'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
      responses:
        '200':
          description: Totals and breakdown by transaction type and currency
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CorporationReport' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/corporations/{corporationId}/donations:
    post:
      tags: [corporations]
      summary: Donate credits from the member's wallet to the treasury
      parameters:
        - $ref: '#/components/parameters/corporationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DonationBody' }
      responses:
        '201':
          description: Donation recorded (internal tax stays in the corporation)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovementResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Not a member, or donations disabled (`DONATIONS_DISABLED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ── Payroll (salaries & primes) ────────────────────────────────────────────
  /api/corporations/{corporationId}/salaries:
    get:
      tags: [corporations]
      summary: Role defaults and per-member salary overrides (economie:treasury:manage)
      parameters:
        - $ref: '#/components/parameters/corporationId'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Salary configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CorporationSalaries' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/corporations/{corporationId}/salaries/roles/{role}:
    put:
      tags: [corporations]
      summary: Set the default salary for a role (economie:treasury:manage)
      parameters:
        - $ref: '#/components/parameters/corporationId'
        - $ref: '#/components/parameters/role'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalaryBody' }
      responses:
        '200':
          description: Stored role salary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CorporationSalaryRole' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/corporations/{corporationId}/salaries/members/{playerId}:
    put:
      tags: [corporations]
      summary: Set a per-member salary override (economie:treasury:manage)
      parameters:
        - $ref: '#/components/parameters/corporationId'
        - $ref: '#/components/parameters/playerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalaryBody' }
      responses:
        '200':
          description: Stored member salary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CorporationMemberSalary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The player is not a member of this corporation (`NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [corporations]
      summary: Remove a per-member salary override (economie:treasury:manage)
      parameters:
        - $ref: '#/components/parameters/corporationId'
        - $ref: '#/components/parameters/playerId'
      responses:
        '204': { description: Override removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/corporations/{corporationId}/payroll:
    post:
      tags: [corporations]
      summary: Pay every member's salary now from the treasury (economie:treasury:manage)
      parameters:
        - $ref: '#/components/parameters/corporationId'
        - $ref: '#/components/parameters/currencyQuery'
      responses:
        '200':
          description: Payout summary (atomic, aborted if the treasury is short)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Treasury balance too low for the whole run (`INSUFFICIENT_FUNDS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/corporations/{corporationId}/members/{playerId}/prime:
    post:
      tags: [corporations]
      summary: Pay a one-off prime to a member from the treasury (economie:treasury:manage)
      parameters:
        - $ref: '#/components/parameters/corporationId'
        - $ref: '#/components/parameters/playerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrimeBody' }
      responses:
        '201':
          description: Prime recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrimeResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The player is not a member of this corporation (`NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ── Admin dashboard ────────────────────────────────────────────────────────
  /api/admin/stats:
    get:
      tags: [admin]
      summary: Economic analytics for the admin dashboard (role `moderator` at least)
      parameters:
        - $ref: '#/components/parameters/days'
        - $ref: '#/components/parameters/top'
      responses:
        '200':
          description: Money supply, transaction volume, rankings and daily series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EconomyStats' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Missing `moderator` role (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/admin/players:
    get:
      tags: [admin]
      summary: Search players by pseudonym, with their wallet balances (role `moderator` at least)
      description: >
        Pseudonyms live in the Social service; this resolves the search through Social's
        internal API and attaches each player's Economy wallet accounts. Returns an empty
        array when the Social integration is not configured.
      parameters:
        - name: search
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Matching players with their wallet accounts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminPlayerPage'}
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Missing `moderator` role (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: The Social lookup failed (`SOCIAL_LOOKUP_FAILED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Internal (game server) ─────────────────────────────────────────────────
  /api/internal/players/{playerId}/wallet:
    put:
      tags: [internal]
      summary: Ensure the player's `credits` account exists (login)
      security: [{ serviceAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/playerId'
      responses:
        '200':
          description: The `credits` account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ServiceForbidden' }
    get:
      tags: [internal]
      summary: List the player's accounts
      security: [{ serviceAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/playerId'
      responses:
        '200':
          description: Player accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ServiceForbidden' }

  /api/internal/players/{playerId}/wallet/transactions:
    get:
      tags: [internal]
      summary: Player ledger
      security: [{ serviceAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/playerId'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Transactions, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransactionPage'}
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ServiceForbidden' }

  /api/internal/players/{playerId}/wallet/credit:
    post:
      tags: [internal]
      summary: Credit the player's wallet (mission reward, salary, etc.)
      security: [{ serviceAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/playerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovementBody' }
      responses:
        '201':
          description: Movement recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovementResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '403': { $ref: '#/components/responses/ServiceForbidden' }

  /api/internal/players/{playerId}/wallet/debit:
    post:
      tags: [internal]
      summary: Debit the player's wallet (rejected when balance is insufficient)
      security: [{ serviceAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/playerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovementBody' }
      responses:
        '201':
          description: Movement recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovementResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '403': { $ref: '#/components/responses/ServiceForbidden' }

  /api/internal/npcs/{npcId}/wallet:
    put:
      tags: [internal]
      summary: Ensure the NPC's `credits` account exists
      security: [{ serviceAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/npcId'
      responses:
        '200':
          description: The `credits` account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ServiceForbidden' }
    get:
      tags: [internal]
      summary: List the NPC's accounts
      security: [{ serviceAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/npcId'
      responses:
        '200':
          description: NPC accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ServiceForbidden' }

  /api/internal/npcs/{npcId}/wallet/transactions:
    get:
      tags: [internal]
      summary: NPC ledger
      security: [{ serviceAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/npcId'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Transactions, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransactionPage'}
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ServiceForbidden' }

  /api/internal/npcs/{npcId}/wallet/credit:
    post:
      tags: [internal]
      summary: Credit the NPC's wallet (salary, prime, sale, etc.)
      security: [{ serviceAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/npcId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovementBody' }
      responses:
        '201':
          description: Movement recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovementResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '403': { $ref: '#/components/responses/ServiceForbidden' }

  /api/internal/npcs/{npcId}/wallet/debit:
    post:
      tags: [internal]
      summary: Debit the NPC's wallet (rejected when balance is insufficient)
      security: [{ serviceAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/npcId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovementBody' }
      responses:
        '201':
          description: Movement recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovementResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '403': { $ref: '#/components/responses/ServiceForbidden' }

  /api/internal/corporations/{corporationId}/wallet:
    put:
      tags: [internal]
      summary: Ensure the corporation's `credits` treasury account exists
      security: [{ serviceAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/corporationId'
      responses:
        '200':
          description: The `credits` treasury account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ServiceForbidden' }
    get:
      tags: [internal]
      summary: List the corporation's treasury accounts
      security: [{ serviceAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/corporationId'
      responses:
        '200':
          description: Treasury accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ServiceForbidden' }

  /api/internal/corporations/{corporationId}/wallet/transactions:
    get:
      tags: [internal]
      summary: Treasury ledger
      security: [{ serviceAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/corporationId'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Corporation ledger across currencies
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransactionPage'}
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ServiceForbidden' }

  /api/internal/corporations/{corporationId}/wallet/credit:
    post:
      tags: [internal]
      summary: Credit the corporation treasury
      security: [{ serviceAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/corporationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovementBody' }
      responses:
        '201':
          description: Movement recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovementResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '403': { $ref: '#/components/responses/ServiceForbidden' }

  /api/internal/corporations/{corporationId}/wallet/debit:
    post:
      tags: [internal]
      summary: Debit the corporation treasury (rejected when balance is insufficient)
      security: [{ serviceAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/corporationId'
      requestBody:
