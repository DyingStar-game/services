        '403': { $ref: '#/components/responses/ServiceForbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Keycloak access token (RS256, validated against the realm JWKS). Moderation
        routes read the realm roles `moderator`, `admin`, `supervisor`.
        Dev only (`AUTH_DEV_BYPASS=true`): `X-Player-Id`, `X-Player-Name`,
        `X-Player-Roles` headers may replace the token.
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Keycloak service-account access token (client_credentials, RS256, validated
        against the realm JWKS). `azp` must be an allowed client
        (`INTERNAL_SERVICE_CLIENTS`) and `aud` must contain `social-api`; each route
        then needs its capability role. Dev only (`INTERNAL_DEV_BYPASS=true`): the
        legacy `X-Internal-Key` header is accepted instead.

  parameters:
    playerId:
      name: playerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    corporationId:
      name: corporationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    groupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    politicalEntityId:
      name: entityId
      in: path
      required: true
      schema: { type: string, format: uuid }
    officeId:
      name: officeId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    requestId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    reportId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    search:
      name: search
      in: query
      description: Case-insensitive substring; empty lists everything
      schema: { type: string, maxLength: 64, default: '' }

    offset:
      in: query
      name: offset
      schema:
        default: 0
        minimum: 0
        type: integer
  responses:
    ValidationError:
      description: Invalid body, query or path parameters (`VALIDATION_ERROR`) or malformed JSON (`INVALID_JSON`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid player token / service token (`UNAUTHORIZED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Missing role or corporation permission (`FORBIDDEN`), or caller is suspended/banned (`SANCTIONED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Sanctioned:
      description: Caller is under an active suspension or ban (`SANCTIONED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found (`NOT_FOUND`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: State conflict (`CONFLICT`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceForbidden:
      description: >
        The service token is not from an allowed client (`SERVICE_FORBIDDEN`) or the
        service account lacks the route's capability role (`FORBIDDEN`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error, message, status]
      properties:
        error:
          type: string
          description: Machine-readable code
          examples: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, SERVICE_FORBIDDEN, SANCTIONED, NOT_FOUND, CONFLICT, BLOCKED, INVALID_TARGET, INTERNAL_ERROR]
        message: { type: string }
        status: { type: integer }

    ProfileIdentity:
      type: object
      description: Minimal profile identity returned to trusted services for name resolution
      required: [playerId, displayName, entityType]
      properties:
        playerId: { type: string, format: uuid }
        displayName: { type: string }
        entityType: { $ref: '#/components/schemas/ProfileKind' }

    # ── ACL (central authorization) ──
    Action:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z][a-z0-9_]*(:[a-z][a-z0-9_]*)*$'
      description: >
        Organisation action. Catalogued actions (`mission:treasury:commit`,
        `economie:treasury:manage`, `market:trade`, `inventory:poi:manage`, legacy
        `manage_*` names) carry evaluation rules; any other string is a *free* action and
        only ever matches an exact permission stored on the rank/office.
    AuthorizeCheck:
      type: object
      required: [holderType, holderId, playerId, action]
      properties:
        holderType: { type: string, enum: [corporation, political] }
        holderId: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        action: { $ref: '#/components/schemas/Action' }
    AuthorizeResult:
      type: object
      required: [holderType, holderId, playerId, action, allowed, reason, role, leader, permissions]
      properties:
        holderType: { type: string, enum: [corporation, political] }
        holderId: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        action: { $ref: '#/components/schemas/Action' }
        allowed: { type: boolean }
        reason:
          type: string
          enum: [allowed, not_member, missing_permission]
          description: Callers map it onto their own error codes (`not_member` → 403 membership, `missing_permission` → 403 permission).
        role: { type: [string, 'null'], description: 'Rank/office name held, null for a non-member' }
        leader: { type: boolean, description: CEO rank / head office — implicitly holds every action }
        permissions:
          type: array
          items: { type: string }
          description: Permissions actually held by the rank/office
    PermissionCatalogRow:
      type: object
      required: [action, holder, legacy, description]
      properties:
        action: { $ref: '#/components/schemas/Action' }
        holder: { type: string, enum: [corporation, political] }
        legacy: { type: boolean, description: Stored as-is on ranks/offices (pre-ACL permission) }
        defaultMember: { type: boolean, description: Granted to every member without any permission }
        satisfiedBy:
          type: array
          items: { type: string }
          description: Legacy permissions that satisfy this action
        description: { type: string, description: Localized through Accept-Language }

    # ── Enums ──
    PresenceStatus:
      type: string
      enum: [online, mission, offline]
    CorporationRecruitmentMode:
      type: string
      enum: [open, apply, closed]
    CorporationPermission:
      description: Legacy corporation permissions (kept for reference; ranks accept any `Action`).
      enum: [manage_corporation, manage_ranks, manage_members, invite, recruit]
    CorporationRequestKind:
      type: string
      enum: [invitation, application]
    ReputationSource:
      type: string
      enum: [game, block, report, sanction, moderation, rehabilitation]
    ReportTargetType:
      type: string
      enum: [player, corporation]
    ReportReason:
      type: string
      enum: [harassment, cheating, griefing, offensive_name, scam, other]
    ReportStatus:
      type: string
      enum: [open, reviewing, resolved, dismissed]
    EscalationLevel:
      type: string
      enum: [moderator, admin, supervisor]
    SanctionType:
      type: string
      enum: [warning, mute, suspension, ban]

    # ── Profiles & presence ──
    RpSheet:
      type: object
      properties:
        characterName: { type: string, maxLength: 64 }
        story: { type: string, maxLength: 4000 }
        alignment: { type: string, maxLength: 32 }

    ProfileKind:
      type: string
      enum: [player, npc]
      description: '`player` = Keycloak-authenticated; `npc` = server-managed, excluded from reputation, sanctions and reports'

    PlayerProfile:
      type: object
      required: [playerId, entityType, displayName, avatarUrl, faction, biography, role, reputation, playtimeSeconds, rpSheet, createdAt, updatedAt]
      properties:
        playerId: { type: string, format: uuid, description: Keycloak subject (players) or server-assigned id (NPCs) }
        entityType: { $ref: '#/components/schemas/ProfileKind' }
        displayName: { type: string }
        avatarUrl: { type: [string, 'null'], format: uri }
        faction: { type: [string, 'null'] }
        biography: { type: [string, 'null'] }
        role: { type: [string, 'null'], description: In-game role reported by the game server }
        reputation: { type: integer }
        playtimeSeconds: { type: integer }
        rpSheet:
          oneOf:
            - $ref: '#/components/schemas/RpSheet'
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProfilePatch:
      type: object
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 2, maxLength: 32 }
        avatarUrl: { type: [string, 'null'], format: uri, maxLength: 512 }
        faction: { type: [string, 'null'], maxLength: 64 }
        biography: { type: [string, 'null'], maxLength: 2000 }
        rpSheet:
          oneOf:
            - $ref: '#/components/schemas/RpSheet'
            - type: 'null'

    Location:
      type: object
      properties:
        system: { type: string, maxLength: 64 }
        scene: { type: string, maxLength: 128 }
        position:
          type: object
          required: [x, y, z]
          properties:
            x: { type: number }
            y: { type: number }
            z: { type: number }

    Presence:
      type: object
      required: [status, location, updatedAt]
      properties:
        status: { $ref: '#/components/schemas/PresenceStatus' }
        location:
          oneOf:
            - $ref: '#/components/schemas/Location'
            - type: 'null'
        updatedAt: { type: string, format: date-time }

    ActivityEntry:
      type: object
      required: [id, playerId, type, details, createdAt]
      properties:
        id: { type: integer }
        playerId: { type: string, format: uuid }
        type:
          type: string
          examples: [profile_created, profile_updated, friend_request_sent, friend_added, player_blocked, corporation_application_sent]
        details: { type: [object, 'null'], additionalProperties: true }
        createdAt: { type: string, format: date-time }

    TargetPlayer:
      type: object
      required: [playerId]
      properties:
        playerId: { type: string, format: uuid }

    # ── Friends ──
    Friendship:
      type: object
      required: [id, requesterId, addresseeId, status, createdAt, updatedAt]
      properties:
        id: { type: integer }
        requesterId: { type: string, format: uuid }
        addresseeId: { type: string, format: uuid }
        status: { type: string, enum: [pending, accepted] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Friend:
      allOf:
        - $ref: '#/components/schemas/PlayerProfile'
        - type: object
          required: [friendsSince, status, location]
          properties:
            friendsSince: { type: string, format: date-time }
            status: { $ref: '#/components/schemas/PresenceStatus' }
            location:
              oneOf:
                - $ref: '#/components/schemas/Location'
                - type: 'null'

    FriendRequest:
      type: object
      required: [id, createdAt, player]
      properties:
        id: { type: integer }
        createdAt: { type: string, format: date-time }
        player: { $ref: '#/components/schemas/PlayerProfile', description: The other party }

    FriendSuggestion:
      allOf:
        - $ref: '#/components/schemas/PlayerProfile'
        - type: object
          required: [lastMetAt, encounters]
          properties:
            lastMetAt: { type: string, format: date-time }
            encounters: { type: integer }

    # ── Corporations ──
    CorporationRef:
      type: object
      required: [id, name, ticker]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        ticker: { type: string }

    Corporation:
      type: object
      required: [id, name, ticker, logoUrl, description, recruitment, parentId, politicalEntityId, ceoId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        ticker: { type: string, description: "Uppercase alphanumeric, 2–5 chars" }
        logoUrl: { type: [string, 'null'], format: uri }
        description: { type: [string, 'null'] }
        recruitment: { $ref: '#/components/schemas/CorporationRecruitmentMode' }
        parentId: { type: [string, 'null'], format: uuid, description: "Holding company this corporation is a subsidiary of" }
        politicalEntityId: { type: [string, 'null'], format: uuid, description: "Political entity (fiscal home) this corporation is attached to" }
        ceoId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CorporationSummary:
      allOf:
        - $ref: '#/components/schemas/Corporation'
        - type: object
          required: [memberCount]
          properties:
            memberCount: { type: integer }

    CreateCorporation:
      type: object
      required: [name, ticker]
      properties:
        name: { type: string, minLength: 3, maxLength: 48 }
        ticker: { type: string, minLength: 2, maxLength: 5, pattern: '^[A-Za-z0-9]+$', description: Stored uppercased }
        description: { type: [string, 'null'], maxLength: 2000 }
        logoUrl: { type: [string, 'null'], format: uri, maxLength: 512 }
        recruitment: { $ref: '#/components/schemas/CorporationRecruitmentMode', default: apply }

    CorporationPatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 3, maxLength: 48 }
        ticker: { type: string, minLength: 2, maxLength: 5, pattern: '^[A-Za-z0-9]+$' }
        description: { type: [string, 'null'], maxLength: 2000 }
        logoUrl: { type: [string, 'null'], format: uri, maxLength: 512 }
        recruitment: { $ref: '#/components/schemas/CorporationRecruitmentMode' }

    CorporationRank:
      type: object
      required: [id, corporationId, name, priority, permissions, isCeo, isDefault]
      properties:
        id: { type: integer }
        corporationId: { type: string, format: uuid }
        name: { type: string }
        priority: { type: integer, description: Higher wins; a member may only act on ranks strictly below their own }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Action' }
        isCeo: { type: boolean, description: "Unique, undeletable, implicitly has all permissions" }
        isDefault: { type: boolean, description: Rank given to new members }

    CreateRank:
      type: object
      required: [name, priority]
      properties:
        name: { type: string, minLength: 1, maxLength: 32 }
        priority: { type: integer, minimum: 0, maximum: 99 }
        permissions:
          type: array
          default: []
          items: { $ref: '#/components/schemas/Action' }
        isDefault: { type: boolean }

    RankPatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 32 }
        priority: { type: integer, minimum: 0, maximum: 99 }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Action' }
        isDefault: { type: boolean }

    CorporationMembership:
      type: object
      required: [corporationId, playerId, rankId, joinedAt]
      properties:
        corporationId: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        rankId: { type: integer }
        joinedAt: { type: string, format: date-time }

    CorporationMember:
      allOf:
        - $ref: '#/components/schemas/PlayerProfile'
        - type: object
          required: [joinedAt, rank, status, location]
          properties:
            joinedAt: { type: string, format: date-time }
            rank: { $ref: '#/components/schemas/CorporationRank' }
            status: { $ref: '#/components/schemas/PresenceStatus' }
            location:
              oneOf:
                - $ref: '#/components/schemas/Location'
                - type: 'null'

    CorporationJoinRequest:
      type: object
      required: [id, corporationId, playerId, kind, message, createdBy, createdAt]
      properties:
        id: { type: integer }
        corporationId: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/CorporationRequestKind' }
        message: { type: [string, 'null'] }
        createdBy: { type: [string, 'null'], format: uuid, description: Inviting member for invitations; null for applications }
        createdAt: { type: string, format: date-time }

    CorporationRequest:
      description: A corporation-side view of a request, with the player's profile
      allOf:
        - $ref: '#/components/schemas/CorporationJoinRequest'
        - type: object
          required: [player]
          properties:
            player: { $ref: '#/components/schemas/PlayerProfile' }

    PlayerCorporationRequest:
      description: A player-side view of a request, with the corporation reference
      allOf:
        - $ref: '#/components/schemas/CorporationJoinRequest'
        - type: object
          required: [corporation]
          properties:
            corporation:
              type: object
              required: [id, name, ticker, logoUrl]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                ticker: { type: string }
                logoUrl: { type: [string, 'null'], format: uri }

    JoinedResult:
      type: object
      required: [joined]
      properties:
        joined: { type: boolean, const: true }

    PendingRequestResult:
      type: object
      required: [joined, request]
      properties:
        joined: { type: boolean, const: false }
        request: { $ref: '#/components/schemas/CorporationJoinRequest' }

    CorporationActivityEntry:
      type: object
      required: [id, corporationId, actorId, type, details, createdAt]
      properties:
        id: { type: integer }
        corporationId: { type: string, format: uuid }
        actorId: { type: [string, 'null'], format: uuid }
        type:
          type: string
          examples: [corporation_created, member_joined, member_left, member_kicked, rank_changed, player_invited, ceo_transferred]
        details: { type: [object, 'null'], additionalProperties: true }
        createdAt: { type: string, format: date-time }

    # ── Groups ──
    Group:
      type: object
      required: [id, name, description, ownerId, maxMembers, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 48 }
        description: { type: [string, 'null'], maxLength: 2000 }
        ownerId: { type: string, format: uuid, description: Owner (passes to the oldest member when they leave) }
        maxMembers: { type: integer, minimum: 2, maximum: 100, default: 10 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    GroupSummary:
      allOf:
        - $ref: '#/components/schemas/Group'
        - type: object
          required: [memberCount]
          properties:
            memberCount: { type: integer }

    GroupMember:
      allOf:
        - $ref: '#/components/schemas/PlayerProfile'
        - type: object
          required: [joinedAt, isOwner, status, location]
          properties:
            joinedAt: { type: string, format: date-time }
            isOwner: { type: boolean }
            status: { $ref: '#/components/schemas/PresenceStatus' }
            location:
              oneOf:
                - $ref: '#/components/schemas/Location'
                - type: 'null'

    GroupMembership:
      type: object
      required: [group, member]
      properties:
        group: { $ref: '#/components/schemas/Group' }
        member:
          type: object
          required: [groupId, playerId, joinedAt]
          properties:
            groupId: { type: string, format: uuid }
            playerId: { type: string, format: uuid }
            joinedAt: { type: string, format: date-time }

    GroupInvitation:
      type: object
      required: [id, groupId, playerId, invitedBy, createdAt]
      properties:
        id: { type: integer }
        groupId: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        invitedBy: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }

    PlayerGroupInvitation:
      allOf:
        - $ref: '#/components/schemas/GroupInvitation'
        - type: object
          required: [group]
          properties:
            group:
              type: object
              required: [id, name]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                description: { type: [string, 'null'] }
                maxMembers: { type: integer }

    CreateGroup:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 48 }
        description: { type: [string, 'null'], maxLength: 2000 }
        maxMembers: { type: integer, minimum: 2, maximum: 100, default: 10 }

    GroupPatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 48 }
        description: { type: [string, 'null'], maxLength: 2000 }
        maxMembers: { type: integer, minimum: 2, maximum: 100 }

    # ── Politics ──
    PoliticalEntityType:
      type: string
      enum: [commune, agglomeration, department, region, country, federation]
      description: '`commune` covers villages and towns; `federation` is the highest, optional level (a country may stay independent)'

    PoliticalPermission:
      description: Legacy political permissions (kept for reference; offices accept any `Action`).
      enum: [manage_entity, manage_offices, manage_members, manage_hierarchy, manage_treasury, issue_currency]

    PoliticalEntityRef:
      type: object
      required: [id, type, name]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/PoliticalEntityType' }
        name: { type: string }

    PoliticalEntity:
      type: object
      required: [id, type, name, description, bannerUrl, parentId, headId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/PoliticalEntityType' }
        name: { type: string }
        description: { type: [string, 'null'] }
        bannerUrl: { type: [string, 'null'], format: uri }
        parentId: { type: [string, 'null'], format: uuid, description: Higher-level entity, or null when independent }
        headId: { type: [string, 'null'], format: uuid, description: Profile (player or NPC) holding the head office }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PoliticalEntitySummary:
      allOf:
        - $ref: '#/components/schemas/PoliticalEntity'
        - type: object
          required: [memberCount]
          properties:
            memberCount: { type: integer }

    CreatePoliticalEntity:
      type: object
      required: [type, name]
      properties:
        type: { $ref: '#/components/schemas/PoliticalEntityType' }
        name: { type: string, minLength: 3, maxLength: 64 }
        description: { type: [string, 'null'], maxLength: 2000 }
        bannerUrl: { type: [string, 'null'], format: uri, maxLength: 512 }

    PoliticalEntityPatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 3, maxLength: 64 }
        description: { type: [string, 'null'], maxLength: 2000 }
        bannerUrl: { type: [string, 'null'], format: uri, maxLength: 512 }

    PoliticalOffice:
      type: object
      required: [id, entityId, name, priority, permissions, isHead, isDefault]
      properties:
        id: { type: integer }
        entityId: { type: string, format: uuid }
        name: { type: string }
        priority: { type: integer, description: Higher wins; a member may only act on offices strictly below their own }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Action' }
        isHead: { type: boolean, description: "Unique, undeletable, implicitly has all permissions" }
        isDefault: { type: boolean, description: Office given to newly appointed members }

    PoliticalOfficeInput:
      type: object
      required: [name, priority]
      properties:
        name: { type: string, minLength: 1, maxLength: 48 }
        priority: { type: integer, minimum: 0, maximum: 99 }
        permissions:
          type: array
          default: []
          items: { $ref: '#/components/schemas/Action' }
        isDefault: { type: boolean }

    PoliticalOfficePatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 48 }
        priority: { type: integer, minimum: 0, maximum: 99 }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Action' }
        isDefault: { type: boolean }

    PoliticalMemberBody:
      type: object
      required: [playerId]
      properties:
        playerId: { type: string, format: uuid }
        officeId: { type: integer, minimum: 1 }

    PoliticalMemberOfficeBody:
      type: object
      required: [officeId]
      properties:
        officeId: { type: integer, minimum: 1 }

    NpcPoliticalBody:
      type: object
      required: [entityId]
      properties:
        entityId: { type: string, format: uuid }
        officeId: { type: integer, minimum: 1 }

    PoliticalMembership:
      type: object
      required: [entityId, playerId, officeId, joinedAt]
      properties:
        entityId: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        officeId: { type: integer }
        joinedAt: { type: string, format: date-time }

    PoliticalMember:
      allOf:
        - $ref: '#/components/schemas/PlayerProfile'
        - type: object
          required: [joinedAt, office, status, location]
          properties:
            joinedAt: { type: string, format: date-time }
            office: { $ref: '#/components/schemas/PoliticalOffice' }
            status: { $ref: '#/components/schemas/PresenceStatus' }
            location:
              oneOf:
                - $ref: '#/components/schemas/Location'
                - type: 'null'

    PoliticalActivityEntry:
      type: object
      required: [id, entityId, actorId, type, details, createdAt]
      properties:
        id: { type: integer }
        entityId: { type: string, format: uuid }
        actorId: { type: [string, 'null'], format: uuid }
        type:
          type: string
          examples: [entity_created, entity_updated, member_appointed, office_changed, parent_set, head_transferred]
        details: { type: [object, 'null'], additionalProperties: true }
        createdAt: { type: string, format: date-time }

    InternalCreateCorporation:
      allOf:
        - $ref: '#/components/schemas/CreateCorporation'
        - type: object
          required: [ceoId]
          properties:
            ceoId: { type: string, format: uuid, description: Profile (player or NPC) to make CEO }

    InternalCreatePoliticalEntity:
      allOf:
        - $ref: '#/components/schemas/CreatePoliticalEntity'
        - type: object
          required: [headId]
          properties:
            headId: { type: string, format: uuid, description: Profile (player or NPC) to make head }

    # ── Reputation & moderation ──
    ReputationEvent:
      type: object
      required: [id, playerId, delta, balance, source, reason, actorId, details, createdAt]
      properties:
        id: { type: integer }
        playerId: { type: string, format: uuid }
        delta: { type: integer }
        balance: { type: integer, description: Score after applying the delta }
        source: { $ref: '#/components/schemas/ReputationSource' }
        reason: { type: string }
        actorId: { type: [string, 'null'], format: uuid }
        details: { type: [object, 'null'], additionalProperties: true }
        createdAt: { type: string, format: date-time }

    CreateReport:
      type: object
      required: [targetType, targetId, reason]
      properties:
        targetType: { $ref: '#/components/schemas/ReportTargetType' }
        targetId: { type: string, format: uuid, description: Player id or corporation id depending on `targetType` }
        reason: { $ref: '#/components/schemas/ReportReason' }
        message: { type: string, maxLength: 1000 }

    Report:
      type: object
      required: [id, reporterId, targetType, targetPlayerId, targetCorporationId, reason, message, status, escalation, resolvedBy, resolutionNote, resolvedAt, createdAt]
      properties:
        id: { type: integer }
        reporterId: { type: [string, 'null'], format: uuid, description: Null for reports raised automatically by the system }
        targetType: { $ref: '#/components/schemas/ReportTargetType' }
        targetPlayerId: { type: [string, 'null'], format: uuid }
        targetCorporationId: { type: [string, 'null'], format: uuid }
        reason:
          type: string
          enum: [harassment, cheating, griefing, offensive_name, scam, other, reputation_threshold]
          description: '`reputation_threshold` is set on system-raised reports'
        message: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ReportStatus' }
        escalation: { $ref: '#/components/schemas/EscalationLevel' }
        resolvedBy: { type: [string, 'null'], format: uuid }
        resolutionNote: { type: [string, 'null'] }
        resolvedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    ReportView:
      allOf:
        - $ref: '#/components/schemas/Report'
        - type: object
          required: [reporterName, targetName]
          properties:
            reporterName: { type: [string, 'null'] }
            targetName: { type: [string, 'null'] }

    Sanction:
      type: object
      required: [id, playerId, type, reason, automatic, issuedBy, expiresAt, revokedAt, revokedBy, createdAt]
      properties:
        id: { type: integer }
        playerId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/SanctionType' }
        reason: { type: string }
        automatic: { type: boolean, description: Issued by the reputation thresholds rather than a moderator }
        issuedBy: { type: [string, 'null'], format: uuid }
        expiresAt: { type: [string, 'null'], format: date-time, description: Null = permanent (or instantaneous for warnings) }
        revokedAt: { type: [string, 'null'], format: date-time }
        revokedBy: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }

    ModerationLogEntry:
      type: object
      required: [id, actorId, action, targetPlayerId, details, createdAt]
      properties:
        id: { type: integer }
        actorId: { type: [string, 'null'], format: uuid }
        action: { type: string }
        targetPlayerId: { type: [string, 'null'], format: uuid }
        details: { type: [object, 'null'], additionalProperties: true }
        createdAt: { type: string, format: date-time }

    CommunityStats:
      type: object
      required: [players, corporations, reports, sanctions, activityLast24h, mostReported, lowestReputation]
      properties:
        players:
          type: object
          required: [total, online]
          properties:
            total: { type: integer }
            online: { type: integer }
        corporations:
          type: object
          required: [total, top]
          properties:
            total: { type: integer }
            top:
              type: array
              description: Top 5 by member count
              items:
                type: object
                required: [id, name, ticker, members]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  ticker: { type: string }
                  members: { type: integer }
        reports:
          type: object
          description: Count per status (missing key = 0)
          additionalProperties: { type: integer }
          propertyNames: { $ref: '#/components/schemas/ReportStatus' }
        sanctions:
          type: object
          required: [active]
          properties:
            active: { type: integer }
        activityLast24h: { type: integer }
        mostReported:
          type: array
          description: Top 5 players by open/reviewing reports
          items:
            type: object
            required: [playerId, reports]
            properties:
              playerId: { type: string, format: uuid }
              reports: { type: integer }
        lowestReputation:
          type: array
          description: 5 lowest scores
          items:
            type: object
            required: [playerId, displayName, reputation]
            properties:
              playerId: { type: string, format: uuid }
              displayName: { type: string }
              reputation: { type: integer }

