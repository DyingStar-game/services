# Local stack: API in watch mode + PostgreSQL + Valkey + Mosquitto. Run from the service root:
#   docker compose -f docker/docker-compose.yml --env-file .env up
name: social

services:
  app:
    image: node:22
    command: >
      sh -c "
        corepack enable &&
        corepack prepare pnpm@10 --activate &&
        pnpm install --config.confirmModulesPurge=false &&
        pnpm dev
      "
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ..:/app
      # Container-owned node_modules: keeps the host install (different pnpm store / platform) out of the way
      - node_modules:/app/node_modules
      - pnpm_store:/app/.pnpm-store
    working_dir: /app
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-social}
      # Overrides a host-oriented VALKEY_URL from .env: inside the stack the cache lives in this compose file
      - VALKEY_URL=redis://valkey:6379
      # Dev broker lives in this compose file (anonymous, see docker/mosquitto-dev.conf):
      # the secret is cleared so the publisher skips the Keycloak token flow
      - MOSQUITTO_URL=mqtt://mosquitto:1883
      - MQTT_CLIENT_SECRET=
      - NODE_ENV=${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - backend

  postgres:
    image: postgres:17
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-social}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-social}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
    restart: unless-stopped

  # Cache only: no persistence (no RDB, no AOF, no volume) — losing it costs one
  # playtime flush interval and a presence re-warm from the next heartbeat.
  valkey:
    image: valkey/valkey:8
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - backend
    restart: unless-stopped

  # Dev-only broker (anonymous): exercises the notification publisher end to end —
  # no go-auth plugin here, the real stack authenticates through chatauth.
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "${MOSQUITTO_PORT:-1883}:1883"
    volumes:
      - ./mosquitto-dev.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  node_modules:
  pnpm_store:

networks:
  backend:
    driver: bridge
