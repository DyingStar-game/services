openapi: 3.1.0
info:
  title: DyingStar universesimulator API
  version: 0.1.0
  description: "Simulates the physical economy (stocks, flows, supply missions, prices) of a federation by\norchestrating\
    \ social, inventory, persistence, mission and economie. See `docs/adr`.\n\nAuthentication (Keycloak):\n- `/api/*`: player\
    \ bearer token (dev: `X-Player-Id`, optional `X-Player-Roles`).\n- `/api/admin/*`: player token with a moderation role\
    \ (`moderator`, `admin`, `supervisor`);\n  writes need `admin` or `supervisor`.\n- `/api/internal/*`: service-account\
    \ token with `aud=universesimulator-api`, `azp` in\n  `INTERNAL_SERVICE_CLIENTS`; `GET` needs `usim:read`, `POST /orders`\
    \ `usim:write`,\n  `POST /warehouse-deliveries` `usim:deliver` (dev: `X-Internal-Key`).\n\nErrors: `{ \"error\": \"<CODE>\"\
    , \"message\": \"<text>\" }`.\n\nIdentifiers are hex UUIDs (8-4-4-4-12) without RFC version/variant constraints: warehouse\n\
    ids are persistence POI UUIDs, which do not carry RFC version bits.\n\nVillages (persistence `poi_village`) are the nodes\
    \ of the simulation: their stock is the sum of\ntheir warehouses (`cargo_depot` objects attached through the `poi_uuid`\
    \ field of their\nobject_data). Thresholds, flows, routes and mineral sources are per village; capacities per\nwarehouse\
    \ (ADR 0013).\n"
servers:
- url: http://localhost:9600
tags:
- name: Public
- name: Read
  description: Available under `/api`, `/api/internal` and `/api/admin`.
- name: Internal
- name: Admin views
- name: Admin
security:
- bearer: []
paths:
  /healthz:
    get:
      tags:
      - Public
      operationId: healthz
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /api/federations:
    get:
      tags:
      - Read
      operationId: listFederations
      responses:
        '200':
          description: Federations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationList'
  /api/entities:
    get:
      tags:
      - Read
      operationId: listEntities
      summary: Political entities mirrored from social
      parameters:
      - $ref: '#/components/parameters/federation'
      responses:
        '200':
          description: Entities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityList'
  /api/resources:
    get:
      tags:
      - Read
      operationId: listResources
      responses:
        '200':
          description: Resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList'
  /api/prices:
    get:
      tags:
      - Read
      operationId: listPrices
      summary: Federation price indices
      parameters:
      - $ref: '#/components/parameters/federation'
      responses:
        '200':
          description: Price indices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceIndexList'
  /api/warehouses:
    get:
      tags:
      - Read
      operationId: listWarehouses
      parameters:
      - $ref: '#/components/parameters/federation'
      - name: village
        in: query
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Warehouses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseList'
  /api/warehouses/{id}:
    get:
      tags:
      - Read
      operationId: getWarehouse
      summary: Warehouse with its live stocks and capacities
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Warehouse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseDetail'
        '404':
          $ref: '#/components/responses/Error'
  /api/entities/{id}/stock:
    get:
      tags:
      - Read
      operationId: getEntityStock
      summary: 'Stock of a political entity: villages whose commune is it or one of its descendants'
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Aggregated stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityStock'
        '404':
          $ref: '#/components/responses/Error'
  /api/paths:
    get:
      tags:
      - Read
      operationId: getPath
      summary: Shortest route between two villages
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      - name: to
        in: query
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      responses:
        '200':
          description: Path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Path'
        '404':
          $ref: '#/components/responses/Error'
  /api/orders:
    get:
      tags:
      - Read
      operationId: listOrders
      summary: Supply orders (meta-missions) with their legs
      parameters:
      - $ref: '#/components/parameters/federation'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/OrderStatus'
      - name: kind
        in: query
        schema:
          type: string
          enum:
          - transport
          - mining
      - name: resource
        in: query
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      - name: village
        in: query
        description: Orders whose path goes through this village
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
  /api/orders/{id}:
    get:
      tags:
      - Read
      operationId: getOrder
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/Error'
  /api/internal/warehouses/by-poi/{id}:
    get:
      tags:
      - Internal
      operationId: getWarehouseByPoi
      summary: Warehouse by persistence POI UUID (same as its id)
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Warehouse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseDetail'
        '404':
          $ref: '#/components/responses/Error'
  /api/internal/warehouse-deliveries:
    post:
      tags:
      - Internal
      operationId: createWarehouseDelivery
      summary: Off-mission delivery to a warehouse (game server, role usim:deliver)
      description: 'Moves the accepted quantity from the deliverer to the warehouse in inventory (capped by the

        warehouse capacity). Idempotent on `idempotencyKey`: a replay returns 200 with the same

        answer; the same key with another content returns 409 `IDEMPOTENCY_CONFLICT`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryInput'
      responses:
        '201':
          description: Delivered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResult'
        '200':
          description: Replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResult'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: IDEMPOTENCY_CONFLICT, DELIVERY_IN_PROGRESS or INSUFFICIENT_STOCK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/internal/orders:
    post:
      tags:
      - Internal
      operationId: createOrderInternal
      summary: Manual transport order (role usim:write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          $ref: '#/components/responses/Error'
  /api/admin/dashboard:
    get:
      tags:
      - Admin views
      operationId: getDashboard
      parameters:
      - $ref: '#/components/parameters/federation'
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
  /api/admin/network:
    get:
      tags:
      - Admin views
      operationId: getNetwork
      summary: Warehouses with positions and stocks, routes and active legs
      parameters:
      - $ref: '#/components/parameters/federation'
      responses:
        '200':
          description: Network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Network'
  /api/admin/stock-history:
    get:
      tags:
      - Admin views
      operationId: getStockHistory
      parameters:
      - name: village
        in: query
        description: 'Village: sum of its warehouses'
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: warehouse
        in: query
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: resource
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - $ref: '#/components/parameters/from'
      responses:
        '200':
          description: History
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockHistory'
      description: '`village` or `warehouse` is required.'
  /api/admin/price-history:
    get:
      tags:
      - Admin views
      operationId: getPriceHistory
      parameters:
      - $ref: '#/components/parameters/federation'
      - name: resource
        in: query
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      - $ref: '#/components/parameters/from'
      responses:
        '200':
          description: History
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceHistory'
  /api/admin/local-prices:
    get:
      tags:
      - Admin views
      operationId: getLocalPrices
      summary: Buy and sell prices per village, largest spread first
      parameters:
      - $ref: '#/components/parameters/federation'
      - name: resource
        in: query
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      responses:
        '200':
          description: Local prices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalPriceList'
  /api/admin/incoming:
    get:
      tags:
      - Admin views
      operationId: getIncoming
      summary: Active legs heading to a village
      parameters:
      - name: village
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Incoming legs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveLegList'
  /api/admin/mint-events:
    get:
      tags:
      - Admin views
      operationId: listMintEvents
      parameters:
      - $ref: '#/components/parameters/federation'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      responses:
        '200':
          description: Mint events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MintEventList'
  /api/admin/federations:
    post:
      tags:
      - Admin
      operationId: createFederation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederationInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Federation'
  /api/admin/federations/{id}:
    put:
      tags:
      - Admin
      operationId: updateFederation
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederationInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Federation'
  /api/admin/resources:
    post:
      tags:
      - Admin
      operationId: upsertResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceInput'
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
  /api/admin/resources/{id}:
    delete:
      tags:
      - Admin
      operationId: deleteResource
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Deleted
  /api/admin/warehouses/{id}:
    delete:
      tags:
      - Admin
      operationId: deactivateWarehouse
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Deactivated
  /api/admin/warehouses/{id}/refresh-poi:
    post:
      tags:
      - Admin
      operationId: refreshWarehousePoi
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
  /api/admin/travel-routes:
    get:
      tags:
      - Admin
      operationId: listTravelRoutes
      parameters:
      - $ref: '#/components/parameters/federation'
      responses:
        '200':
          description: Routes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelRouteList'
    post:
      tags:
      - Admin
      operationId: upsertTravelRoute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TravelRouteInput'
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelRoute'
  /api/admin/travel-routes/{id}:
    delete:
      tags:
      - Admin
      operationId: deleteTravelRoute
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Deleted
  /api/admin/flows:
    get:
      tags:
      - Admin
      operationId: listFlows
      parameters:
      - $ref: '#/components/parameters/federation'
      - name: village
        in: query
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Flows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowList'
    post:
      tags:
      - Admin
      operationId: createFlow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flow'
  /api/admin/flows/{id}:
    put:
      tags:
      - Admin
      operationId: updateFlow
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ratePerHour:
                  type: number
                label:
                  type:
                  - string
                  - 'null'
                  description: 'Absent: unchanged; null or empty: cleared'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flow'
    delete:
      tags:
      - Admin
      operationId: deleteFlow
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Deleted
  /api/admin/mineral-sources:
    get:
      tags:
      - Admin
      operationId: listMineralSources
      parameters:
      - $ref: '#/components/parameters/federation'
      - name: village
        in: query
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Mineral sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MineralSourceList'
    put:
      tags:
      - Admin
      operationId: upsertMineralSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MineralSourceInput'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MineralSource'
  /api/admin/mineral-sources/{id}:
    delete:
      tags:
      - Admin
      operationId: deleteMineralSource
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Deleted
  /api/admin/orders:
    post:
      tags:
      - Admin
      operationId: createOrderAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          $ref: '#/components/responses/Error'
  /api/admin/orders/{id}/cancel:
    post:
      tags:
      - Admin
      operationId: cancelOrder
      summary: Cancels the published mission, releases the hold and closes the order
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Cancelled
        '409':
          $ref: '#/components/responses/Error'
  /api/admin/simulation:
    get:
      tags:
      - Admin
      operationId: getSimulation
      responses:
        '200':
          description: Simulation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Simulation'
  /api/admin/simulation/tick:
    post:
      tags:
      - Admin
      operationId: forceTick
      summary: Runs a tick now (even when paused)
      responses:
        '200':
          description: Tick report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickReport'
        '409':
          description: TICK_RUNNING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/simulation/pause:
    post:
      tags:
      - Admin
      operationId: pauseSimulation
      responses:
        '200':
          description: State
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationState'
  /api/admin/simulation/resume:
    post:
      tags:
      - Admin
      operationId: resumeSimulation
      responses:
        '200':
          description: State
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationState'
  /api/admin/import:
    post:
      tags:
      - Admin
      operationId: importWorld
      summary: Idempotent bootstrap of a federation's world from persistence (see seeds/)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: World file (see seeds/tarsis_3-ares.json)
      responses:
        '200':
          description: Import report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReport'
      description: The world file is kept and replayed by the tick (periodically and on each forced tick), so new villages
        and depots linked in persistence are simulated without a new import.
  /api/villages:
    get:
      tags:
      - Read
      operationId: listVillages
      summary: Villages with their aggregated stocks
      parameters:
      - $ref: '#/components/parameters/federation'
      - name: entity
        in: query
        description: Commune (political entity) of the village
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Villages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VillageList'
  /api/villages/{id}:
    get:
      tags:
      - Read
      operationId: getVillage
      summary: 'Village: aggregated stocks (read live from inventory), warehouses, policies, flows, capacities, mineral sources,
        local prices, incoming legs'
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Village
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VillageDetail'
        '404':
          $ref: '#/components/responses/Error'
  /api/admin/villages/{id}:
    put:
      tags:
      - Admin
      operationId: updateVillage
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VillageUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Village'
        '400':
          $ref: '#/components/responses/Error'
  /api/admin/village-policies:
    get:
      tags:
      - Admin
      operationId: listVillagePolicies
      parameters:
      - $ref: '#/components/parameters/federation'
      - name: village
        in: query
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Policies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VillagePolicyList'
    put:
      tags:
      - Admin
      operationId: upsertVillagePolicy
      description: Creates or replaces a village policy; 400 unless 0 <= minThreshold <= targetLevel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VillagePolicy'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VillagePolicy'
        '400':
          $ref: '#/components/responses/Error'
  /api/admin/village-policies/{village}/{resource}:
    delete:
      tags:
      - Admin
      operationId: deleteVillagePolicy
      parameters:
      - name: village
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: resource
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '204':
          description: Deleted
  /api/admin/warehouse-capacities:
    get:
      tags:
      - Admin
      operationId: listWarehouseCapacities
      parameters:
      - $ref: '#/components/parameters/federation'
      - name: village
        in: query
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: warehouse
        in: query
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Capacities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseCapacityList'
    put:
      tags:
      - Admin
      operationId: upsertWarehouseCapacity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseCapacityInput'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseCapacity'
        '400':
          $ref: '#/components/responses/Error'
  /api/admin/warehouse-capacities/{warehouse}/{resource}:
    delete:
      tags:
      - Admin
      operationId: deleteWarehouseCapacity
      parameters:
      - name: warehouse
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: resource
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '204':
          description: Deleted
components:
