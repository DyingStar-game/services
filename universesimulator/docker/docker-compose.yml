services:
  universesimulator:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://universesimulator:universesimulator@postgres:5432/universesimulator
    ports:
      - "9600:9600"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: universesimulator
      POSTGRES_PASSWORD: universesimulator
      POSTGRES_DB: universesimulator
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U universesimulator -d universesimulator"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
