openapi: 3.1.0
info:
  title: DyingStar — API (tous services)
  version: 0.1.0
  description: 'Document agrege (fusion) de **tous** les endpoints des services mission, social, economie, inventory et market
    : public, joueur, `/api/internal/*` (serveur de jeu, tokens de service) et `/api/admin/*`.


    Chaque service expose aussi sa propre spec sur `GET /openapi.yaml`. Chaque operation porte son service (tag) et l''override
    `servers` du chemin (les services sont des processus distincts partageant le prefixe `/api`).


    Authentification : JWT Keycloak joueur (`bearerAuth`) ou token de service (`serviceAuth`, `/api/internal/*`). En dev uniquement,
    `AUTH_DEV_BYPASS=true` / `INTERNAL_DEV_BYPASS=true` acceptent les en-tetes `X-Player-Id` / `X-Internal-Key`.


    Erreurs : { error, message, status }.'
tags:
- name: public
  description: Non authentifie (partage)
- name: mission
  description: Service mission
  servers:
  - url: http://mission:3000
- name: social
  description: Service social
  servers:
  - url: http://social:3000
- name: economie
  description: Service economie
  servers:
  - url: http://economie:3000
- name: inventory
  description: Service inventory
  servers:
  - url: http://inventory:3000
- name: market
  description: Service market
  servers:
  - url: http://market:3000
security:
- bearerAuth: []
paths:
  /api/admin/log:
    get:
      tags:
      - social
      operationId: getModerationLog
      summary: Moderation audit log
      parameters:
      - $ref: '#/components/parameters/social_limit'
      - $ref: '#/components/parameters/social_offset'
      responses:
        '200':
          description: Log entries, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_ModerationLogEntryPage'
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
    servers:
    - url: http://social:3000
      description: social
  /api/admin/players:
    get:
      tags:
      - economie
      summary: Search players by pseudonym, with their wallet balances (role `moderator` at least)
      description: 'Pseudonyms live in the Social service; this resolves the search through Social''s internal API and attaches
        each player''s Economy wallet accounts. Returns an empty array when the Social integration is not configured.

        '
      parameters:
      - name: search
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - $ref: '#/components/parameters/economie_limit'
      - $ref: '#/components/parameters/economie_offset'
      responses:
        '200':
          description: Matching players with their wallet accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/economie_AdminPlayerPage'
        '400':
          $ref: '#/components/responses/economie_ValidationError'
        '401':
          $ref: '#/components/responses/economie_Unauthorized'
        '403':
          description: Missing `moderator` role (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/economie_Error'
        '502':
          description: The Social lookup failed (`SOCIAL_LOOKUP_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/economie_Error'
    servers:
    - url: http://economie:3000
      description: economie
  /api/admin/players/{playerId}:
    get:
      tags:
      - social
      operationId: getPlayerRecord
      summary: Player record
      description: Profile with reputation history, sanctions, reports received and activity (50 rows each).
      parameters:
      - $ref: '#/components/parameters/social_playerId'
      responses:
        '200':
          description: Player record
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/social_PlayerProfile'
                - type: object
                  required:
                  - reputationEvents
                  - sanctions
                  - reports
                  - activity
                  properties:
                    reputationEvents:
                      type: array
                      items:
                        $ref: '#/components/schemas/social_ReputationEvent'
                    sanctions:
                      type: array
                      items:
                        $ref: '#/components/schemas/social_Sanction'
                    reports:
                      type: array
                      items:
                        $ref: '#/components/schemas/social_ReportView'
                    activity:
                      type: array
                      items:
                        $ref: '#/components/schemas/social_ActivityEntry'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
        '404':
          $ref: '#/components/responses/social_NotFound'
    servers:
    - url: http://social:3000
      description: social
  /api/admin/players/{playerId}/reputation:
    post:
      tags:
      - social
      operationId: adjustReputation
      summary: Manual reputation adjustment (`admin`)
      parameters:
      - $ref: '#/components/parameters/social_playerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - delta
              - reason
              properties:
                delta:
                  type: integer
                  minimum: -100
                  maximum: 100
                  description: Non-zero
                reason:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        '200':
          description: New score
          content:
            application/json:
              schema:
                type: object
                required:
                - playerId
                - reputation
                properties:
                  playerId:
                    type: string
                    format: uuid
                  reputation:
                    type: integer
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
        '404':
          $ref: '#/components/responses/social_NotFound'
    servers:
    - url: http://social:3000
      description: social
  /api/admin/players/{playerId}/sanctions:
    post:
      tags:
      - social
      operationId: issueSanction
      summary: Issue a sanction
      description: '`warning` / `mute`: moderator. `suspension` / `ban`: admin.'
      parameters:
      - $ref: '#/components/parameters/social_playerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              - reason
              properties:
                type:
                  $ref: '#/components/schemas/social_SanctionType'
                reason:
                  type: string
                  minLength: 1
                  maxLength: 256
                durationHours:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
                  maximum: 8760
                  description: Omit or `null` for a permanent sanction (warnings are instantaneous)
      responses:
        '201':
          description: Sanction issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_Sanction'
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
        '404':
          $ref: '#/components/responses/social_NotFound'
    servers:
    - url: http://social:3000
      description: social
  /api/admin/reports:
    get:
      tags:
      - social
      operationId: listReports
      summary: Report queue
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/social_ReportStatus'
      - name: escalation
        in: query
        schema:
          $ref: '#/components/schemas/social_EscalationLevel'
      - name: targetPlayerId
        in: query
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/social_limit'
      - $ref: '#/components/parameters/social_offset'
      responses:
        '200':
          description: Reports, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_ReportViewPage'
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
    servers:
    - url: http://social:3000
      description: social
  /api/admin/reports/{id}:
    get:
      tags:
      - social
      operationId: getReport
      summary: One report
      responses:
        '200':
          description: Report with reporter and target names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_ReportView'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
        '404':
          $ref: '#/components/responses/social_NotFound'
    patch:
      tags:
      - social
      operationId: updateReportStatus
      summary: Move a report through the workflow
      description: '`resolved` upholds the report (target loses `REPUTATION_UPHELD_REPORT_PENALTY`), `dismissed` refunds the
        initial report penalty.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - reviewing
                  - resolved
                  - dismissed
                note:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Updated report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_Report'
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
        '404':
          $ref: '#/components/responses/social_NotFound'
        '409':
          $ref: '#/components/responses/social_Conflict'
    parameters:
    - $ref: '#/components/parameters/social_reportId'
    servers:
    - url: http://social:3000
      description: social
  /api/admin/reports/{id}/escalate:
    post:
      tags:
      - social
      operationId: escalateReport
      summary: Escalate one level (moderator → admin → supervisor)
      parameters:
      - $ref: '#/components/parameters/social_reportId'
      responses:
        '200':
          description: Escalated report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_Report'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
        '404':
          $ref: '#/components/responses/social_NotFound'
        '409':
          description: Already at the top level
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_Error'
    servers:
    - url: http://social:3000
      description: social
  /api/admin/sanctions:
    get:
      tags:
      - social
      operationId: listSanctions
      summary: Sanctions listing
      parameters:
      - name: playerId
        in: query
        schema:
          type: string
          format: uuid
      - name: active
        in: query
        description: Only active (not revoked, not expired) sanctions
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'true'
      - $ref: '#/components/parameters/social_limit'
      - $ref: '#/components/parameters/social_offset'
      responses:
        '200':
          description: Sanctions, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_SanctionPage'
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
    servers:
    - url: http://social:3000
      description: social
  /api/admin/sanctions/{id}:
    delete:
      tags:
      - social
      operationId: revokeSanction
      summary: Revoke a sanction
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Revoked sanction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_Sanction'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
        '404':
          $ref: '#/components/responses/social_NotFound'
        '409':
          $ref: '#/components/responses/social_Conflict'
    servers:
    - url: http://social:3000
      description: social
  /api/admin/stats:
    get:
      tags:
      - economie
      - social
      operationId: getCommunityStats
      summary: Community analytics
      responses:
        '200':
          description: Aggregated counters and top lists
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/social_CommunityStats'
                - $ref: '#/components/schemas/economie_EconomyStats'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
        '400':
          $ref: '#/components/responses/economie_ValidationError'
      description: Also served by the economie service on the same path.
    servers:
    - url: http://social:3000
      description: social
    - url: http://economie:3000
      description: economie
  /api/blocks:
    get:
      tags:
      - social
      operationId: listBlocks
      summary: Blocked players
      parameters:
      - $ref: '#/components/parameters/social_limit'
      - $ref: '#/components/parameters/social_offset'
      responses:
        '200':
          description: Blocked profiles with block date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_BlockedProfilePage'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Sanctioned'
    post:
      tags:
      - social
      operationId: blockPlayer
      summary: Block a player
      description: 'Drops any friendship or pending request between the two players, prevents new ones and costs the blocked
        player `REPUTATION_BLOCK_PENALTY` (refunded on unblock). Idempotent.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/social_TargetPlayer'
      responses:
        '204':
          description: Player blocked
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Sanctioned'
        '404':
          $ref: '#/components/responses/social_NotFound'
    servers:
    - url: http://social:3000
      description: social
  /api/blocks/{playerId}:
    delete:
      tags:
      - social
      operationId: unblockPlayer
      summary: Unblock a player
      parameters:
      - $ref: '#/components/parameters/social_playerId'
      responses:
        '204':
          description: Block removed
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Sanctioned'
        '404':
          $ref: '#/components/responses/social_NotFound'
    servers:
    - url: http://social:3000
      description: social
  /api/corporations:
    get:
      tags:
      - social
      operationId: listCorporations
      summary: Corporation directory
      parameters:
      - $ref: '#/components/parameters/social_search'
      - $ref: '#/components/parameters/social_limit'
      - $ref: '#/components/parameters/social_offset'
      responses:
        '200':
          description: Corporations matching name or ticker, with member counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_CorporationSummaryPage'
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Sanctioned'
    post:
      tags:
      - social
      operationId: createCorporation
      summary: Create a corporation
      description: 'The caller becomes the CEO and holds the CEO rank. Default ranks are created: CEO (100, all permissions),
        Director (50: invite, recruit, manage_members), Member (0, default rank). A player belongs to at most one corporation.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/social_CreateCorporation'
      responses:
        '201':
          description: Corporation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_Corporation'
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Sanctioned'
        '409':
          description: Already in a corporation, or name/ticker already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_Error'
    servers:
    - url: http://social:3000
      description: social
  /api/corporations/{corporationId}:
    get:
      tags:
      - social
      operationId: getCorporation
      summary: Public corporation page
      responses:
        '200':
          description: Corporation with ranks and members (with presence)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/social_CorporationSummary'
                - properties:
                    memberCount:
                      minimum: 0
                      type: integer
                    members:
                      items:
                        $ref: '#/components/schemas/social_CorporationMember'
                      type: array
                    parent:
                      oneOf:
                      - $ref: '#/components/schemas/social_CorporationRef'
                      - type: 'null'
                    ranks:
                      items:
                        $ref: '#/components/schemas/social_CorporationRank'
                      type: array
                    subsidiaries:
                      items:
                        $ref: '#/components/schemas/social_CorporationSummary'
                      type: array
                    subsidiaryCount:
                      minimum: 0
                      type: integer
                  required:
                  - ranks
                  - members
                  - parent
                  - subsidiaries
                  - memberCount
                  - subsidiaryCount
                  type: object
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Sanctioned'
        '404':
          $ref: '#/components/responses/social_NotFound'
    patch:
      tags:
      - social
      operationId: updateCorporation
      summary: Edit a corporation
      description: Requires the `manage_corporation` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/social_CorporationPatch'
      responses:
        '200':
          description: Updated corporation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_Corporation'
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
        '404':
          $ref: '#/components/responses/social_NotFound'
        '409':
          $ref: '#/components/responses/social_Conflict'
    delete:
      tags:
      - social
      operationId: disbandCorporation
      summary: Disband a corporation (CEO only)
      responses:
        '204':
          description: Corporation disbanded
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
        '404':
          $ref: '#/components/responses/social_NotFound'
    parameters:
    - $ref: '#/components/parameters/social_corporationId'
    servers:
    - url: http://social:3000
      description: social
  /api/corporations/{corporationId}/activity:
    get:
      tags:
      - social
      operationId: getCorporationActivity
      summary: Internal corporation journal (members only)
      parameters:
      - $ref: '#/components/parameters/social_corporationId'
      - $ref: '#/components/parameters/social_limit'
      - $ref: '#/components/parameters/social_offset'
      responses:
        '200':
          description: Journal entries, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_CorporationActivityPage'
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
        '404':
          $ref: '#/components/responses/social_NotFound'
    servers:
    - url: http://social:3000
      description: social
  /api/corporations/{corporationId}/donations:
    post:
      tags:
      - economie
      summary: Donate credits from the member's wallet to the treasury
      parameters:
      - $ref: '#/components/parameters/economie_corporationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/economie_DonationBody'
      responses:
        '201':
          description: Donation recorded (internal tax stays in the corporation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/economie_MovementResult'
        '400':
          $ref: '#/components/responses/economie_ValidationError'
        '401':
          $ref: '#/components/responses/economie_Unauthorized'
        '403':
          description: Not a member, or donations disabled (`DONATIONS_DISABLED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/economie_Error'
        '409':
          $ref: '#/components/responses/economie_Conflict'
    servers:
    - url: http://economie:3000
      description: economie
  /api/corporations/{corporationId}/inventory:
    get:
      tags:
      - inventory
      summary: Corporation inventory (member only, membership checked in Social)
      parameters:
      - $ref: '#/components/parameters/inventory_corporationId'
      - $ref: '#/components/parameters/inventory_limit'
      - $ref: '#/components/parameters/inventory_offset'
      responses:
        '200':
          description: Inventory of the corporation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inventory_HolderInventory'
        '401':
          $ref: '#/components/responses/inventory_Unauthorized'
        '403':
          description: Not a member of this corporation (`NOT_CORPORATION_MEMBER`), or Social not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inventory_Error'
    servers:
    - url: http://inventory:3000
      description: inventory
  /api/corporations/{corporationId}/inventory/stacks/{goodType}:
    get:
      tags:
      - inventory
      summary: One corporation stack (member only)
      parameters:
      - $ref: '#/components/parameters/inventory_corporationId'
      - $ref: '#/components/parameters/inventory_goodType'
      responses:
        '200':
          description: The stack
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inventory_StackView'
        '401':
          $ref: '#/components/responses/inventory_Unauthorized'
        '403':
          $ref: '#/components/responses/inventory_Forbidden'
        '404':
          $ref: '#/components/responses/inventory_NotFound'
    servers:
    - url: http://inventory:3000
      description: inventory
  /api/corporations/{corporationId}/invitations:
    post:
      tags:
      - social
      operationId: inviteToCorporation
      summary: Invite a player (`invite`)
      description: A pending application from that player is accepted instead (`200`).
      parameters:
      - $ref: '#/components/parameters/social_corporationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/social_TargetPlayer'
      responses:
        '200':
          description: Player joined the corporation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_JoinedResult'
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_PendingRequestResult'
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
        '404':
          $ref: '#/components/responses/social_NotFound'
        '409':
          description: Player already in a corporation, invitation already pending, or a block exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_Error'
    servers:
    - url: http://social:3000
      description: social
  /api/corporations/{corporationId}/join:
    post:
      tags:
      - social
      operationId: joinCorporation
