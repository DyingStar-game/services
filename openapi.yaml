    social_NotFound:
      description: Resource not found (`NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/social_Error'
    social_Conflict:
      description: State conflict (`CONFLICT`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/social_Error'
    social_ServiceForbidden:
      description: 'The service token is not from an allowed client (`SERVICE_FORBIDDEN`) or the service account lacks the
        route''s capability role (`FORBIDDEN`)

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/social_Error'
    economie_ValidationError:
      description: Invalid body, query or path parameters (`VALIDATION_ERROR`) or malformed JSON (`INVALID_JSON`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/economie_Error'
    economie_Unauthorized:
      description: Missing or invalid player token / service token (`UNAUTHORIZED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/economie_Error'
    economie_Forbidden:
      description: 'Missing `economie:treasury:manage` / not a corporation member (`FORBIDDEN`, `NOT_CORPORATION_MEMBER`),
        account is locked/frozen (`ACCOUNT_LOCKED`), or donations disabled (`DONATIONS_DISABLED`)

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/economie_Error'
    economie_NotFound:
      description: Resource not found (`NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/economie_Error'
    economie_Conflict:
      description: State conflict (`CONFLICT`, `INSUFFICIENT_FUNDS`, `DUPLICATE_EXTERNAL_ID`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/economie_Error'
    economie_ServiceForbidden:
      description: 'The service token is not from an allowed client (`SERVICE_FORBIDDEN`) or the service account lacks the
        route''s capability role (`FORBIDDEN`)

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/economie_Error'
    inventory_ValidationError:
      description: Invalid body, query or path parameters (`VALIDATION_ERROR`) or malformed JSON (`INVALID_JSON`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/inventory_Error'
    inventory_Unauthorized:
      description: Missing or invalid player token / service token (`UNAUTHORIZED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/inventory_Error'
    inventory_Forbidden:
      description: Not a corporation member (`NOT_CORPORATION_MEMBER`) or missing role (`FORBIDDEN`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/inventory_Error'
    inventory_NotFound:
      description: Resource not found (`NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/inventory_Error'
    inventory_Conflict:
      description: 'State conflict (`CONFLICT`, `INSUFFICIENT_GOODS`): good-type nature mismatch, held or insufficient goods,
        instance already owned/held.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/inventory_Error'
    inventory_ServiceForbidden:
      description: 'The service token is not from an allowed client (`SERVICE_FORBIDDEN`) or the service account lacks the
        route''s capability role (`FORBIDDEN`)

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/inventory_Error'
    inventory_PoiNotFound:
      description: POI or one of its grants not found (`NOT_FOUND`, `POI_NOT_SHARED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/inventory_Error'
    inventory_PoiForbidden:
      description: 'Not the owner (`NOT_POI_OWNER`), a system-owned POI (`POI_SYSTEM_OWNER_FORBIDDEN`), not a member or without
        the organization''s management permission (`NOT_CORPORATION_MEMBER`, `NOT_POLITICAL_MEMBER`, `ORG_PERMISSION_REQUIRED`),
        or missing role (`FORBIDDEN`)

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/inventory_Error'
