          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mission_Mission'
        '400':
          $ref: '#/components/responses/mission_ValidationError'
        '401':
          $ref: '#/components/responses/mission_Unauthorized'
        '403':
          description: Not a corporation mission, not a member, or missing permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mission_Error'
              examples:
                forbidden:
                  value:
                    error: EVENT_FORBIDDEN
                    message: Requires the mission:event:manage permission
                    status: 403
        '404':
          $ref: '#/components/responses/mission_NotFound'
    servers:
    - url: http://mission:3000
      description: mission
  /api/missions/{missionId}/objectives/{objectiveId}/confirm:
    post:
      tags:
