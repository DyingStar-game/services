  responses:
    mission_Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/mission_Error'
    mission_Forbidden:
      description: Authenticated but missing the required role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/mission_Error'
    mission_NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/mission_Error'
    mission_ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/mission_Error'
          examples:
            invalid:
              value:
                error: VALIDATION_ERROR
                message: 'objectives: Array must contain at least 1 element(s)'
                status: 400
    social_ValidationError:
      description: Invalid body, query or path parameters (`VALIDATION_ERROR`) or malformed JSON (`INVALID_JSON`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/social_Error'
    social_Unauthorized:
      description: Missing or invalid player token / service token (`UNAUTHORIZED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/social_Error'
    social_Forbidden:
      description: Missing role or corporation permission (`FORBIDDEN`), or caller is suspended/banned (`SANCTIONED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/social_Error'
    social_Sanctioned:
      description: Caller is under an active suspension or ban (`SANCTIONED`)
      content:
        application/json:
          schema:
