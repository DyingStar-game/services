      - $ref: '#/components/parameters/mission_AssignmentStatus'
      - $ref: '#/components/parameters/mission_Limit'
      responses:
        '200':
          description: Player missions
          content:
            application/json:
              schema:
                type: object
                required:
                - missions
                properties:
                  missions:
                    type: array
                    items:
                      $ref: '#/components/schemas/mission_PlayerMission'
        '401':
          $ref: '#/components/responses/mission_Unauthorized'
      security:
      - bearerAuth: []
    servers: &id009
    - url: http://mission:3000
      description: mission
    - *id006
    - *id002
    - *id007
    - *id008
  /api/me/reputation:
    get:
      tags:
      - social
      operationId: getMyReputation
      summary: Own reputation score, history and active sanctions
      description: Reachable while suspended or banned.
      parameters:
      - $ref: '#/components/parameters/social_limit'
      responses:
        '200':
          description: Reputation summary
