        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Sanctioned'
    servers:
    - url: http://social:3000
      description: social
  /api/transfers:
    post:
      tags:
      - economie
      summary: Direct credits transfer to another player (automatic tax, payer side)
      requestBody:
