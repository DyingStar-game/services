      description: mission
  /api/missions/{missionId}/objectives/{objectiveId}/progress:
    post:
      tags:
      - mission
      summary: Report progress on one objective (quantity delivered/transported)
      parameters:
      - $ref: '#/components/parameters/mission_MissionId'
      - $ref: '#/components/parameters/mission_ObjectiveId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - quantity
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  example: 5
      responses:
        '200':
          description: Updated objective and mission progress
          content:
            application/json:
              schema:
                type: object
                required:
                - objective
                - objectives
                - allComplete
                properties:
                  objective:
                    $ref: '#/components/schemas/mission_Objective'
                  objectives:
                    type: array
                    items:
                      $ref: '#/components/schemas/mission_Objective'
                  allComplete:
                    type: boolean
        '400':
          $ref: '#/components/responses/mission_ValidationError'
        '401':
          $ref: '#/components/responses/mission_Unauthorized'
        '404':
          $ref: '#/components/responses/mission_NotFound'
        '409':
          description: Objective locked, mission closed, assignment not active, or kind not pushable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mission_Error'
              examples:
                locked:
                  value:
                    error: OBJECTIVE_LOCKED
