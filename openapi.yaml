      summary: Attach to a higher-level entity, or detach (manage_hierarchy)
      description: 'The parent must be of a strictly higher level (a country may stay independent with `parentId: null`).
        Refuses cycles (`409 POLITICAL_CYCLE`) and invalid levels (`400 INVALID_PARENT_LEVEL`).

        '
      parameters:
      - $ref: '#/components/parameters/social_politicalEntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - parentId
              properties:
                parentId:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        '200':
          description: Updated entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_PoliticalEntity'
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
        '404':
          $ref: '#/components/responses/social_NotFound'
        '409':
          $ref: '#/components/responses/social_Conflict'
    servers:
    - url: http://social:3000
      description: social
  /api/politics/{entityId}/pois:
