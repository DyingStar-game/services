      type: object
      required:
      - corporationId
      - totals
      - byType
      properties:
        corporationId:
          type: string
          format: uuid
        from:
          type:
          - string
          - 'null'
          format: date-time
        to:
          type:
          - string
          - 'null'
          format: date-time
        totals:
          type: array
          description: Inflow/outflow per currency (outflow includes taxes paid by the corporation)
          items:
            type: object
            required:
            - currency
            - inflow
            - outflow
            properties:
              currency:
                type: string
              inflow:
                type: integer
              outflow:
                type: integer
        byType:
          type: array
          description: Breakdown of the same flows by transaction type and currency
          items:
            type: object
            required:
            - type
            - currency
            - count
            - inflow
            - outflow
            properties:
              type:
                $ref: '#/components/schemas/economie_TransactionType'
              currency:
