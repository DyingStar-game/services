      - status
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        holderType:
          $ref: '#/components/schemas/economie_AccountHolderType'
        holderId:
          type: string
          format: uuid
          description: Keycloak subject for players
          Social `corporationId` for corporations: null
          reserved key for the system vault: null
        currency:
          type: string
          default: credits
        balance:
          type: integer
          description: Integer minor units
          never negative: null
        status:
          $ref: '#/components/schemas/economie_AccountStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    economie_Transaction:
      type: object
      required:
      - id
      - type
      - currency
      - amount
      - taxAmount
      - feeAmount
      - createdAt
      properties:
        id:
          type: integer
          format: int64
        fromAccountId:
          type:
          - string
          - 'null'
          format: uuid
        toAccountId:
          type:
          - string
          - 'null'
          format: uuid
        type:
          $ref: '#/components/schemas/economie_TransactionType'
        currency:
          type: string
        amount:
          type: integer
          description: Amount credited to `toAccountId`
        taxAmount:
          type: integer
          description: Tax collected from the payer and routed to `details.taxTo`
        feeAmount:
          type: integer
        externalId:
          type:
          - string
          - 'null'
          description: Idempotency key unique when present
        reference:
          type:
          - string
          - 'null'
        caller:
          type:
          - string
          - 'null'
          description: Keycloak client id of the calling service; null for player-driven movements
        details:
          oneOf:
          - type: object
            description: Free-form; `taxTo` records where the collected tax went (`system` or an account id)
          - type: 'null'
        createdAt:
          type: string
          format: date-time
    economie_MovementResult:
      type: object
      required:
      - transaction
      - amount
      - taxAmount
      properties:
        transaction:
          $ref: '#/components/schemas/economie_Transaction'
        amount:
          type: integer
        taxAmount:
          type: integer
        fromBalance:
          type: integer
          description: New payer balance after the movement
        toBalance:
          type: integer
          description: New receiver balance after the movement
    economie_TransferBody:
      type: object
      required:
      - toPlayerId
      - amount
      properties:
        toPlayerId:
          type: string
          format: uuid
          description: Must differ from the caller
        amount:
          type: integer
          minimum: 1
          description: Integer minor units — what the receiver gets; the payer also pays the tax
        memo:
          type: string
          maxLength: 256
    economie_MovementBody:
      type: object
      required:
      - amount
      properties:
        amount:
          type: integer
          minimum: 1
        currency:
          type: string
          maxLength: 16
          default: credits
        reference:
          type: string
          maxLength: 128
        externalId:
          type: string
          minLength: 1
          maxLength: 128
          description: Idempotency key; replaying a movement returns `409 DUPLICATE_EXTERNAL_ID`
        type:
          description: Overrides the default type (default `deposit` on credit, `withdrawal` on debit)
          oneOf:
          - type: string
          - $ref: '#/components/schemas/economie_TransactionType'
    economie_DonationBody:
      type: object
      required:
