      description: 'POI state conflict: `POI_ALREADY_SHARED`, `POI_SELF_SHARE` (grantee already owns it) or `POI_TRANSFER_SELF`
        (target already owns it)

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/inventory_Error'
    inventory_SocialUnavailable:
      description: 'The Social service is unreachable or not configured while checking organization membership (`SOCIAL_NOT_CONFIGURED`,
        `SOCIAL_LOOKUP_FAILED`, `SOCIAL_AUTH_FAILED`)

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/inventory_Error'
    market_ValidationError:
      description: Invalid body, query or path parameters (`VALIDATION_ERROR`) or malformed JSON (`INVALID_JSON`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/market_Error'
    market_Unauthorized:
      description: Missing or invalid player token / service token (`UNAUTHORIZED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/market_Error'
    market_Forbidden:
      description: Not the resource owner (`FORBIDDEN`), or the corporation `market:trade` check refused (`NOT_CORPORATION_MEMBER`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/market_Error'
    market_NotFound:
      description: Resource not found (`NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/market_Error'
    market_Conflict:
      description: State conflict (`CONFLICT`, `INSUFFICIENT_GOODS`, `INSUFFICIENT_FUNDS`, unknown/disabled good)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/market_Error'
    market_ServiceForbidden:
      description: 'The service token is not from an allowed client (`SERVICE_FORBIDDEN`) or lacks the route''s capability
        role (`FORBIDDEN`)

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/market_Error'
  schemas:
    mission_MissionStatus:
      type: string
      enum:
      - available
      - active
      - completed
      - cancelled
      - expired
    mission_MissionKind:
      type: string
      enum:
      - dynamic
      - scenario
      - player
    mission_MissionCategory:
      type: string
      enum:
      - delivery
      - transport
      - generic
      - mining
      - farming
      - crafting
      - construction
      - trading
      - exploration
      - salvage
      - combat
      - reception
    mission_MissionVisibility:
      type: string
      enum:
      - public
      - corporation
    mission_EscrowStatus:
      type: string
      enum:
      - none
      - pending
      - held
      - refunded
      - claimed
    mission_IssuerType:
      type: string
      enum:
      - system
      - corporation
      - city
      - politics
      - player
      - npc
    mission_ObjectiveType:
      type: string
      description: 'Objective kind name, validated against the kind registry (`GET /api/missions/kinds`)

        '
      example: deliver_material
    mission_ObjectiveStatus:
      type: string
      enum:
      - pending
      - in_progress
      - completed
      - failed
    mission_AssignmentStatus:
      type: string
      enum:
      - active
      - completed
      - abandoned
      - expired
    mission_AssigneeHolderType:
      type: string
      enum:
      - player
      - npc
      default: player
      description: Whether the assignee is a player or an NPC (drives reward routing)
    mission_RewardComponent:
      description: 'One reward component of the mission''s reward list (at most one credits component, distinct item components).
        Immutable after creation.

        '
      oneOf:
      - type: object
        required:
        - type
        - amount
        properties:
          type:
            const: credits
          currency:
            type: string
            default: credits
          amount:
            type: integer
            minimum: 1
      - type: object
        required:
        - type
        - itemId
        - quantity
        properties:
          type:
            const: item
          itemId:
            type: string
            description: Inventory good type
          quantity:
            type: integer
            minimum: 1
          instanceId:
            type: string
            format: uuid
            description: Unique-instance reward (single assignee only)
    mission_Prerequisite:
      description: A gate checked when a player accepts the mission (kind registry-validated)
      type: object
      required:
      - kind
      properties:
        kind:
          type: string
          description: Prerequisite kind name (`has_credits`, `owns_items`, `min_reputation`, `corporation_member`)
          example: has_credits
        params:
          type: object
          additionalProperties: true
          description: Kind-specific structured params (schemas served by GET /api/missions/kinds)
    mission_MissionZone:
      description: 'One availability zone, matched against the presence location reported by the game server. A `system` zone
        matches the star system. A `poi` zone references a point of interest in the Inventory service: a POI carrying a `scene`
        and no radius matches its hierarchical scene subtree (`tarsis_1` matches `tarsis_1/new-paris`, never `tarsis_10`);
        a radius (declared on the zone, overriding the POI''s own) matches the area around the POI centre; otherwise only
        the exact position matches. A POI that cannot be resolved never matches (fail closed), and creating a zone on an unknown
        POI is rejected with `POI_NOT_FOUND`. Coordinates share the units of `location.position` (meters assumed).

        '
      oneOf:
      - type: object
        required:
        - kind
        - system
        properties:
          kind:
            const: system
          system:
            type: string
            maxLength: 64
      - type: object
        required:
        - kind
        - poiId
        properties:
          kind:
            const: poi
          poiId:
            type: string
            format: uuid
            description: POI id owned by the Inventory service
          radiusM:
            type: integer
            minimum: 1
            maximum: 1000000
            description: Overrides the POI's own radius to match an area (metres)
    mission_Mission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        kind:
          $ref: '#/components/schemas/mission_MissionKind'
        category:
          $ref: '#/components/schemas/mission_MissionCategory'
        issuerType:
          $ref: '#/components/schemas/mission_IssuerType'
        issuerId:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: '#/components/schemas/mission_MissionStatus'
        rewards:
          type: array
          nullable: true
          description: Reward components (immutable after creation; null/empty for reputation-only missions)
          items:
            $ref: '#/components/schemas/mission_RewardComponent'
        prerequisites:
          type: array
          description: Gates checked at acceptance (immutable after creation)
          items:
            $ref: '#/components/schemas/mission_Prerequisite'
        visibility:
          $ref: '#/components/schemas/mission_MissionVisibility'
        groupId:
          type: string
          format: uuid
          nullable: true
          description: 'Group the mission is shared with / claimed by (opaque id owned by Social). When set, only its members
            can see and accept the mission.

            '
        groupClaimable:
          type: boolean
          description: 'Limited to a single group: the first group to accept claims the mission, then only its members may
            join (until `maxAssignees`).

            '
        isEvent:
          type: boolean
          description: Big event mission declared by the game server or a corporation (open multijoueur)
        zones:
          type: array
          description: 'Availability zones matched against the player''s presence location; empty = global (available everywhere)

            '
          items:
            $ref: '#/components/schemas/mission_MissionZone'
        maxAssignees:
          type: integer
        escrowStatus:
          $ref: '#/components/schemas/mission_EscrowStatus'
        escrowAmount:
          type: integer
          nullable: true
        escrowCurrency:
          type: string
          nullable: true
        escrowPayerId:
          type: string
          format: uuid
          nullable: true
        escrowPayerType:
          type: string
          enum:
          - player
          - corporation
          - politics
          description: Holder kind of `escrowPayerId` (refund target on cancel/expire)
        escrowItemStatus:
          type: string
          enum:
          - none
          - held
          - claimed
          - released
          description: Item escrow lifecycle (all item reward components)
        escrowItemHoldIds:
          type: array
          nullable: true
          description: Inventory hold ids of the item components (aligned with the item rewards)
          items:
            type: string
        scriptId:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    mission_Objective:
      type: object
      properties:
        id:
          type: string
          format: uuid
        missionId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/mission_ObjectiveType'
        title:
          type: string
        description:
          type: string
          nullable: true
        targetQuantity:
          type: integer
        unit:
          type: string
          nullable: true
        locationFrom:
          type: object
          additionalProperties: true
          nullable: true
        locationTo:
          type: object
          additionalProperties: true
          nullable: true
        order:
          type: integer
        status:
          $ref: '#/components/schemas/mission_ObjectiveStatus'
        currentProgress:
          type: integer
        params:
          type: object
          additionalProperties: true
          nullable: true
          description: Kind-specific structured params (validated by the kind's params schema)
        payload:
          type: object
          additionalProperties: true
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    mission_Assignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        missionId:
          type: string
          format: uuid
        playerId:
          type: string
          format: uuid
        holderType:
          $ref: '#/components/schemas/mission_AssigneeHolderType'
        status:
          $ref: '#/components/schemas/mission_AssignmentStatus'
        acceptedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        rewardShares:
          type: array
          nullable: true
          description: Frozen share of every reward component, fixed at completion
          items:
            $ref: '#/components/schemas/mission_RewardComponent'
        rewardAmount:
          type: integer
          nullable: true
          description: Frozen credits share at completion (used by escrow refund math)
        rewardSettled:
          type: boolean
          description: Credits phase settled
        rewardExternalId:
          type: string
        rewardSettledAt:
          type: string
          format: date-time
          nullable: true
        rewardDetails:
          type: object
          additionalProperties: true
          nullable: true
        settledComponents:
          type: array
          description: Item components already granted (`item:<itemId>`), each at most once
          items:
            type: string
    mission_PlayerMission:
      type: object
      properties:
        assignment:
          $ref: '#/components/schemas/mission_Assignment'
        mission:
          oneOf:
          - $ref: '#/components/schemas/mission_Mission'
          - type: 'null'
    mission_Settlement:
      type: object
      properties:
        settled:
          type: boolean
        skipped:
          type: boolean
        reason:
          type: string
          example: credited
        assignment:
          $ref: '#/components/schemas/mission_Assignment'
    mission_CreateMission:
      type: object
      required:
      - title
      - objectives
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        kind:
          $ref: '#/components/schemas/mission_MissionKind'
        category:
          $ref: '#/components/schemas/mission_MissionCategory'
        issuerType:
          $ref: '#/components/schemas/mission_IssuerType'
        issuerId:
          type: string
          format: uuid
          nullable: true
        rewards:
          type: array
          description: Reward components (empty/omitted for reputation-only missions)
          items:
            $ref: '#/components/schemas/mission_RewardComponent'
        prerequisites:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/mission_Prerequisite'
        maxAssignees:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
        groupClaimable:
          type: boolean
          default: false
          description: 'Limited to a single group: the first group to accept claims it'
        isEvent:
          type: boolean
          default: false
          description: Big event mission (open multijoueur)
        zones:
          type: array
          description: Availability zones (empty = global)
          items:
            $ref: '#/components/schemas/mission_MissionZone'
        scriptId:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        objectives:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/mission_CreateObjective'
    mission_CreateObjective:
      type: object
      required:
      - type
      - title
      properties:
        type:
          type: string
          description: Objective kind (registry-validated, see GET /api/missions/kinds)
          example: deliver_material
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        targetQuantity:
          type: integer
          minimum: 1
          description: Quantity target (ignored by non-quantity kinds)
        unit:
          type: string
        locationFrom:
          type: object
          additionalProperties: true
        locationTo:
          type: object
          additionalProperties: true
        order:
          type: integer
          minimum: 0
        params:
          type: object
          additionalProperties: true
          description: Kind-specific structured params (validated by the kind's params schema)
        payload:
          type: object
          additionalProperties: true
    mission_UpdateMission:
      type: object
      minProperties: 1
      description: 'Presentation fields only: the spec (objectives, prerequisites, rewards, capacity) is immutable after creation.
        `zones` is mutable (no escrow impact): the game re-zones live events through the internal API.

        '
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 4000
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        isEvent:
          type: boolean
          description: Declare (or lift) the big event flag (game server only)
        zones:
          type: array
          items:
            $ref: '#/components/schemas/mission_MissionZone'
    mission_ValidateMission:
      type: object
      required:
      - mission
      description: Dry-run of a mission spec (no persistence, no escrow)
      properties:
        mode:
          type: string
          enum:
          - player
          - internal
          default: internal
          description: '`player` also enforces the reward-required and escrowed-item rules'
        mission:
          $ref: '#/components/schemas/mission_CreateMission'
    mission_ValidatedSpec:
      type: object
      properties:
        valid:
          type: boolean
          const: true
        spec:
          type: object
          description: Normalized spec (kind params parsed, defaults applied)
          properties:
            objectives:
              type: array
              items:
                $ref: '#/components/schemas/mission_CreateObjective'
            prerequisites:
              type: array
              items:
                $ref: '#/components/schemas/mission_Prerequisite'
            rewards:
              type: array
              items:
                $ref: '#/components/schemas/mission_RewardComponent'
    mission_CreatePlayerMission:
      type: object
      required:
      - title
      - rewards
      - objectives
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        category:
          $ref: '#/components/schemas/mission_MissionCategory'
        visibility:
          $ref: '#/components/schemas/mission_MissionVisibility'
        corporationId:
          type: string
          format: uuid
          nullable: true
          description: Required when `visibility` is `corporation`
        politicalEntityId:
          type: string
          format: uuid
          nullable: true
          description: Alternative issuer (political entity); mutually exclusive with corporationId
        escrowSource:
          type: string
          enum:
          - creator
          - issuer
          default: creator
          description: '`creator` debits the creator''s wallet (default); `issuer` debits the issuing organization''s treasury
            (corporation or political entity — requires the `mission:treasury:commit` action: CEO/head, or `manage_corporation`
            / `manage_treasury`)

            '
        rewards:
          type: array
          minItems: 1
          description: 'Reward components escrowed from the creator: the credits component is debited from their wallet, each
            item component is held in their inventory.

            '
          items:
            $ref: '#/components/schemas/mission_RewardComponent'
        prerequisites:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/mission_Prerequisite'
        maxAssignees:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
        groupClaimable:
          type: boolean
          default: false
          description: 'Limited to a single group: the first group to accept claims it'
        zones:
          type: array
          description: Availability zones (empty = global)
          items:
            $ref: '#/components/schemas/mission_MissionZone'
        expiresAt:
          type: string
          format: date-time
          nullable: true
        objectives:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/mission_CreateObjective'
    mission_VerifyResult:
      type: object
      properties:
        objectives:
          type: array
          items:
            $ref: '#/components/schemas/mission_Objective'
        allComplete:
          type: boolean
    mission_ConfirmResult:
      type: object
      properties:
        objective:
          $ref: '#/components/schemas/mission_Objective'
        objectives:
          type: array
          items:
            $ref: '#/components/schemas/mission_Objective'
        allComplete:
          type: boolean
    mission_MissionKindsCatalog:
      type: object
      description: Discovery catalogue consumed by mission builders
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/mission_MissionCategory'
        objectiveKinds:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
              name:
                type: string
                description: Short localized label for mission builders (from `Accept-Language`, default `en`)
              evaluation:
                type: string
                enum:
                - game
                - service
                - issuer
                description: '`game`: reported by the game server, `service`: measured by this service, `issuer`: confirmed
                  by the mission creator'
              quantity:
                type: boolean
                description: Uses targetQuantity/currentProgress accumulation
              summary:
                type: string
                description: Localized from the ambient language (`Accept-Language`); `{name}` field references stay literal
              categories:
                description: Mission categories this kind may be used on (`all` = every category)
                oneOf:
                - type: string
                  const: all
                - type: array
                  items:
                    $ref: '#/components/schemas/mission_MissionCategory'
              params:
                type: object
                additionalProperties: true
                description: JSON Schema of the kind's params
        prerequisiteKinds:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
              name:
                type: string
                description: Short localized label for mission builders (from `Accept-Language`, default `en`)
              summary:
                type: string
              categories:
                description: Mission categories this prerequisite may be used on (`all` = every category)
                oneOf:
                - type: string
                  const: all
                - type: array
                  items:
                    $ref: '#/components/schemas/mission_MissionCategory'
              params:
                type: object
                additionalProperties: true
        rewards:
          type: object
          additionalProperties: true
          description: JSON Schema of the reward component list
    mission_ShareMission:
      type: object
      required:
      - groupId
      properties:
        groupId:
          type: string
          format: uuid
          description: Target group (must exist in Social)
    mission_EventFlag:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: Whether the mission is a big event mission
        maxAssignees:
          type: integer
          minimum: 1
          maximum: 1000
          description: Optional new capacity (events allow up to 1000)
    mission_Error:
      type: object
      required:
      - error
      - message
      - status
      properties:
        error:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
        status:
          type: integer
          example: 400
    social_Error:
      type: object
      required:
      - error
      - message
      - status
      properties:
        error:
          type: string
          description: Machine-readable code
          examples:
          - VALIDATION_ERROR
          - UNAUTHORIZED
          - FORBIDDEN
          - SERVICE_FORBIDDEN
          - SANCTIONED
          - NOT_FOUND
          - CONFLICT
          - BLOCKED
          - INVALID_TARGET
          - INTERNAL_ERROR
        message:
          type: string
        status:
          type: integer
    social_ProfileIdentity:
      type: object
      description: Minimal profile identity returned to trusted services for name resolution
      required:
      - playerId
      - displayName
      - entityType
      properties:
        playerId:
          type: string
          format: uuid
        displayName:
          type: string
        entityType:
          $ref: '#/components/schemas/social_ProfileKind'
    social_Action:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[a-z][a-z0-9_]*(:[a-z][a-z0-9_]*)*$
      description: 'Organisation action. Catalogued actions (`mission:treasury:commit`, `economie:treasury:manage`, `market:trade`,
        `inventory:poi:manage`, legacy `manage_*` names) carry evaluation rules; any other string is a *free* action and only
        ever matches an exact permission stored on the rank/office.

        '
    social_AuthorizeCheck:
      type: object
      required:
      - holderType
      - holderId
      - playerId
      - action
      properties:
        holderType:
          type: string
          enum:
          - corporation
          - political
        holderId:
          type: string
          format: uuid
        playerId:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/social_Action'
    social_AuthorizeResult:
      type: object
      required:
      - holderType
      - holderId
      - playerId
      - action
      - allowed
      - reason
      - role
      - leader
      - permissions
      properties:
        holderType:
          type: string
          enum:
          - corporation
          - political
        holderId:
          type: string
          format: uuid
        playerId:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/social_Action'
        allowed:
          type: boolean
        reason:
          type: string
          enum:
          - allowed
          - not_member
          - missing_permission
          description: Callers map it onto their own error codes (`not_member` → 403 membership, `missing_permission` → 403
            permission).
        role:
          type:
          - string
          - 'null'
          description: Rank/office name held, null for a non-member
        leader:
          type: boolean
          description: CEO rank / head office — implicitly holds every action
        permissions:
          type: array
          items:
            type: string
          description: Permissions actually held by the rank/office
    social_PermissionCatalogRow:
      type: object
      required:
      - action
      - holder
      - legacy
      - description
      properties:
        action:
          $ref: '#/components/schemas/social_Action'
        holder:
          type: string
          enum:
          - corporation
          - political
        legacy:
          type: boolean
          description: Stored as-is on ranks/offices (pre-ACL permission)
        defaultMember:
          type: boolean
          description: Granted to every member without any permission
        satisfiedBy:
          type: array
          items:
            type: string
          description: Legacy permissions that satisfy this action
        description:
          type: string
          description: Localized through Accept-Language
    social_PresenceStatus:
      type: string
      enum:
      - online
      - mission
      - offline
    social_CorporationRecruitmentMode:
      type: string
      enum:
      - open
      - apply
      - closed
    social_CorporationPermission:
      description: Legacy corporation permissions (kept for reference; ranks accept any `Action`).
      enum:
      - manage_corporation
      - manage_ranks
      - manage_members
      - invite
      - recruit
    social_CorporationRequestKind:
      type: string
      enum:
      - invitation
      - application
    social_ReputationSource:
      type: string
      enum:
      - game
      - block
      - report
      - sanction
      - moderation
      - rehabilitation
    social_ReportTargetType:
      type: string
      enum:
      - player
      - corporation
    social_ReportReason:
      type: string
      enum:
      - harassment
      - cheating
      - griefing
      - offensive_name
      - scam
      - other
    social_ReportStatus:
      type: string
      enum:
      - open
      - reviewing
      - resolved
      - dismissed
    social_EscalationLevel:
      type: string
      enum:
      - moderator
      - admin
      - supervisor
    social_SanctionType:
      type: string
      enum:
      - warning
      - mute
      - suspension
      - ban
    social_RpSheet:
      type: object
      properties:
        characterName:
          type: string
          maxLength: 64
        story:
          type: string
          maxLength: 4000
        alignment:
          type: string
          maxLength: 32
    social_ProfileKind:
      type: string
      enum:
      - player
      - npc
      description: '`player` = Keycloak-authenticated; `npc` = server-managed, excluded from reputation, sanctions and reports'
    social_PlayerProfile:
      type: object
