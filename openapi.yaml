        '401':
          $ref: '#/components/responses/economie_Unauthorized'
        '404':
          $ref: '#/components/responses/economie_NotFound'
        '409':
          description: Insufficient balance or already recorded `externalId` (`INSUFFICIENT_FUNDS` / `DUPLICATE_EXTERNAL_ID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/economie_Error'
        '403':
          $ref: '#/components/responses/economie_Forbidden'
    servers:
    - url: http://economie:3000
      description: economie
  /openapi.yaml:
    get:
      tags:
      - public
      summary: This service's OpenAPI document
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 document (YAML)
          content:
            application/yaml:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Keycloak service-account access token (client_credentials, RS256, validated against the realm JWKS). `azp`
        must be an allowed client (`INTERNAL_SERVICE_CLIENTS`) and `aud` must contain `social-api`; each route then needs
        its capability role. Dev only (`INTERNAL_DEV_BYPASS=true`): the legacy `X-Internal-Key` header is accepted instead.

        '
