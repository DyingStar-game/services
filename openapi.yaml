  /api/internal/authorize:
    post:
      tags:
      - social
      operationId: internalAuthorize
      summary: Decide whether a player holds an action on an organisation
      description: 'Central ACL. Accepts one check or `{ "checks": [...] }` (max 50) and **always

        answers 200**: a refusal is a result, never an error, so a batch keeps all of its

        answers. Requires the `social:authorize` capability role.

        '
      security:
      - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/social_AuthorizeCheck'
              - type: object
                required:
                - checks
                properties:
                  checks:
                    type: array
                    minItems: 1
                    maxItems: 50
                    items:
                      $ref: '#/components/schemas/social_AuthorizeCheck'
      responses:
        '200':
          description: 'The decision (single check → one result, batch → `{ results: [...] }`)'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/social_AuthorizeResult'
                - type: object
                  required:
