                    - joinedAt
                    - rank
                    properties:
                      joinedAt:
                        type: string
                        format: date-time
                      rank:
                        $ref: '#/components/schemas/social_CorporationRank'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Sanctioned'
      security:
      - bearerAuth: []
    servers: *id001
  /api/me/inventory:
    get:
      tags:
      - inventory
      summary: The caller's inventory (stacks with held/available, and owned instances)
      responses:
        '200':
          description: Inventory of the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inventory_HolderInventory'
        '401':
          $ref: '#/components/responses/inventory_Unauthorized'
      security:
      - bearerAuth: []
    servers: *id003
  /api/me/inventory/stacks/{goodType}:
    get:
      tags:
      - inventory
      summary: One stack of the caller, with held and available quantities
      parameters:
      - $ref: '#/components/parameters/inventory_goodType'
      responses:
        '200':
          description: The stack
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inventory_StackView'
        '401':
          $ref: '#/components/responses/inventory_Unauthorized'
        '404':
          $ref: '#/components/responses/inventory_NotFound'
      security:
      - bearerAuth: []
    servers: *id003
  /api/me/missions:
    get:
      tags:
      - mission
      summary: The caller's missions (assignments joined with their mission)
