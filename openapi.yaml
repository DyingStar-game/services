    social_corporationId:
      name: corporationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    social_groupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    social_politicalEntityId:
      name: entityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    social_officeId:
      name: officeId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    social_requestId:
