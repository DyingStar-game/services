  /api/missions/{missionId}/event:
    post:
      tags:
      - mission
      summary: Declare (or lift) the "big event" flag on a corporation mission
      description: 'Events are the exception to the capacity cap: they allow up to 1000 assignees and stay listed as long
        as they have a free slot. Requires the `mission:event:manage` action in the issuing corporation (decided by Social:
        CEO or `manage_corporation`). Lifting the flag requires `maxAssignees` ≤ 100.

        '
      parameters:
      - $ref: '#/components/parameters/mission_MissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/mission_EventFlag'
      responses:
