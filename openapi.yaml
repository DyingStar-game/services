  /api/missions:
    get:
      tags:
      - mission
      summary: Browse missions with a free slot (defaults to `available` + `active`)
      description: 'Missions without a free assignee slot (`maxAssignees` reached) are hidden, missions shared with a group
        are only listed to that group''s members, and zoned missions only to players inside one of their zones (unknown location
        → only global missions; a Social outage degrades to "no group, no location").

        '
      parameters:
      - $ref: '#/components/parameters/mission_MissionStatus'
      - $ref: '#/components/parameters/mission_MissionKind'
      - $ref: '#/components/parameters/mission_MissionCategory'
      - $ref: '#/components/parameters/mission_IssuerType'
      - $ref: '#/components/parameters/mission_IssuerId'
      - $ref: '#/components/parameters/mission_Visibility'
      - $ref: '#/components/parameters/mission_GroupId'
      - $ref: '#/components/parameters/mission_GroupClaimable'
      - $ref: '#/components/parameters/mission_IsEvent'
      - $ref: '#/components/parameters/mission_Limit'
      - $ref: '#/components/parameters/mission_Offset'
      responses:
        '200':
          description: Missions
          content:
            application/json:
              schema:
                properties:
                  limit:
                    default: 20
                    maximum: 100
                    minimum: 1
                    type: integer
                  missions:
                    items:
                      $ref: '#/components/schemas/mission_Mission'
                    type: array
                  offset:
                    default: 0
                    minimum: 0
                    type: integer
                  total:
                    minimum: 0
                    type: integer
                required:
                - missions
                - total
                - limit
                - offset
                type: object
        '400':
          $ref: '#/components/responses/mission_ValidationError'
        '401':
          $ref: '#/components/responses/mission_Unauthorized'
    post:
      tags:
      - mission
      summary: Create a player-sponsored mission (economic reward escrowed from the caller)
      description: 'Reward components are escrowed until settlement or refund: items are held from the creator''s inventory,
        and the credits component is debited either from the creator''s wallet (`escrowSource: creator`, default) or from
        the issuing organization''s treasury (`escrowSource: issuer` — corporation or political entity, requires the `mission:treasury:commit`
        action decided by Social: CEO/head, or the `manage_corporation` / `manage_treasury` permission).

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/mission_CreatePlayerMission'
      responses:
        '201':
          description: Created mission and objectives (escrow held)
          content:
            application/json:
              schema:
                type: object
                properties:
                  mission:
                    $ref: '#/components/schemas/mission_Mission'
                  objectives:
                    type: array
                    items:
                      $ref: '#/components/schemas/mission_Objective'
        '400':
          description: 'Validation failed (`VALIDATION_ERROR`, including the issuer/`escrowSource` refines) or `ESCROW_SOURCE_INVALID`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mission_Error'
        '401':
          $ref: '#/components/responses/mission_Unauthorized'
        '403':
          description: 'Not allowed (`NOT_CORPORATION_MEMBER` or `TREASURY_FORBIDDEN` when funding an organization treasury
            without its permission)

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mission_Error'
              examples:
                treasury:
                  value:
                    error: TREASURY_FORBIDDEN
                    message: Requires the CEO role or the manage_corporation permission
                    status: 403
        '409':
          description: Escrow refused (insufficient funds)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mission_Error'
              examples:
                broke:
                  value:
                    error: INSUFFICIENT_FUNDS
                    message: Insufficient balance for the mission escrow
                    status: 409
        '502':
          description: Economy or Social is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mission_Error'
    servers:
    - url: http://mission:3000
      description: mission
