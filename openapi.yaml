                  $ref: '#/components/schemas/social_ActivityEntry'
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Sanctioned'
      security:
      - bearerAuth: []
    servers: *id001
  /api/me/corporation/requests:
    get:
      tags:
      - social
      operationId: getMyCorporationRequests
      summary: My pending corporation invitations and applications
      responses:
        '200':
          description: Pending requests with the corporation reference
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/social_PlayerCorporationRequest'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Sanctioned'
      security:
      - bearerAuth: []
    servers: *id001
  /api/me/corporation/requests/{id}/accept:
    post:
      tags:
      - social
      operationId: acceptCorporationInvitation
      summary: Accept a corporation invitation
      parameters:
      - $ref: '#/components/parameters/social_requestId'
      responses:
        '204':
          description: Joined the corporation
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
        '404':
          $ref: '#/components/responses/social_NotFound'
        '409':
          $ref: '#/components/responses/social_Conflict'
      security:
      - bearerAuth: []
    servers: *id001
  /api/me/corporation/requests/{id}/decline:
    post:
      tags:
      - social
      operationId: declineCorporationRequest
      summary: Decline an invitation or withdraw an application
      parameters:
      - $ref: '#/components/parameters/social_requestId'
      responses:
        '204':
          description: Request removed
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
        '404':
          $ref: '#/components/responses/social_NotFound'
      security:
      - bearerAuth: []
    servers: *id001
  /api/me/corporations:
    get:
      tags:
      - social
      operationId: getMyCorporations
      summary: Every corporation the caller belongs to, with rank
      responses:
        '200':
          description: Corporation memberships (empty when the player belongs to none)
