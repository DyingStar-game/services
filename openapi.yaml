            application/json:
              schema:
                type: object
                required:
                - reputation
                - events
                - activeSanctions
                properties:
                  reputation:
                    type: integer
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/social_ReputationEvent'
                  activeSanctions:
                    type: array
                    items:
                      $ref: '#/components/schemas/social_Sanction'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
      security:
      - bearerAuth: []
    servers: *id001
  /api/me/sanctions:
    get:
      tags:
      - social
      operationId: getMySanctions
      summary: Own active sanctions
      description: Reachable while suspended or banned.
      responses:
        '200':
          description: Active sanctions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/social_Sanction'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
      security:
      - bearerAuth: []
    servers: *id001
  /api/me/wallet:
    get:
      tags:
      - economie
      summary: All wallet accounts of the caller (one per currency, `credits` auto-created)
      responses:
        '200':
          description: Wallet accounts
          content:
            application/json:
              schema:
                type: object
                required:
                - accounts
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/economie_Account'
        '401':
          $ref: '#/components/responses/economie_Unauthorized'
      security:
      - bearerAuth: []
    servers: *id004
  /api/me/wallet/transactions:
    get:
      tags:
      - economie
      summary: Ledger of the caller across all currencies
      parameters:
      - $ref: '#/components/parameters/economie_limit'
      responses:
        '200':
          description: Transactions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/economie_Transaction'
        '400':
          $ref: '#/components/responses/economie_ValidationError'
        '401':
          $ref: '#/components/responses/economie_Unauthorized'
      security:
      - bearerAuth: []
    servers: *id004
  /api/missions:
    get:
      tags:
      - mission
      summary: Browse missions (defaults to the `available` ones)
      parameters:
      - $ref: '#/components/parameters/mission_MissionStatus'
      - $ref: '#/components/parameters/mission_MissionKind'
      - $ref: '#/components/parameters/mission_MissionCategory'
      - $ref: '#/components/parameters/mission_IssuerType'
      - $ref: '#/components/parameters/mission_IssuerId'
      - $ref: '#/components/parameters/mission_Visibility'
      - $ref: '#/components/parameters/mission_Limit'
      responses:
        '200':
          description: Missions
          content:
            application/json:
              schema:
                type: object
                required:
                - missions
                properties:
                  missions:
                    type: array
                    items:
                      $ref: '#/components/schemas/mission_Mission'
        '400':
          $ref: '#/components/responses/mission_ValidationError'
        '401':
          $ref: '#/components/responses/mission_Unauthorized'
      security:
      - bearerAuth: []
    servers: *id009
    post:
      tags:
      - mission
      summary: Create a player-sponsored mission (economic reward escrowed from the caller)
      description: 'The economic reward is debited from the caller''s wallet through Economy and held until settlement or
        refund. Corporation missions require membership (checked in Social). Item rewards are not supported here.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/mission_CreatePlayerMission'
      responses:
        '201':
          description: Created mission and objectives (escrow held)
          content:
            application/json:
              schema:
                type: object
                properties:
                  mission:
                    $ref: '#/components/schemas/mission_Mission'
                  objectives:
                    type: array
                    items:
                      $ref: '#/components/schemas/mission_Objective'
        '400':
          $ref: '#/components/responses/mission_ValidationError'
        '401':
          $ref: '#/components/responses/mission_Unauthorized'
        '403':
          description: Caller is not a member of the target corporation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mission_Error'
        '409':
          description: Escrow refused (insufficient funds)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mission_Error'
              examples:
                broke:
                  value:
                    error: INSUFFICIENT_FUNDS
                    message: Insufficient balance for the mission escrow
                    status: 409
        '502':
          description: Economy or Social is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mission_Error'
      security:
      - bearerAuth: []
  /api/missions/{missionId}:
    get:
      tags:
      - mission
      summary: Mission detail with its objectives and the caller's assignment
      parameters:
      - $ref: '#/components/parameters/mission_MissionId'
      responses:
        '200':
          description: Mission, objectives and assignment
          content:
            application/json:
              schema:
                type: object
                required:
                - mission
                - objectives
                properties:
                  mission:
                    $ref: '#/components/schemas/mission_Mission'
                  objectives:
                    type: array
                    items:
                      $ref: '#/components/schemas/mission_Objective'
                  assignment:
                    oneOf:
                    - $ref: '#/components/schemas/mission_Assignment'
                    - type: 'null'
        '401':
          $ref: '#/components/responses/mission_Unauthorized'
        '404':
          $ref: '#/components/responses/mission_NotFound'
      security:
      - bearerAuth: []
    servers: *id009
  /api/missions/{missionId}/abandon:
    post:
      tags:
      - mission
      summary: Abandon the caller's active assignment
      parameters:
      - $ref: '#/components/parameters/mission_MissionId'
      responses:
        '200':
          description: Updated assignment
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignment:
                    $ref: '#/components/schemas/mission_Assignment'
        '401':
          $ref: '#/components/responses/mission_Unauthorized'
        '404':
          $ref: '#/components/responses/mission_NotFound'
        '409':
          description: Assignment is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mission_Error'
      security:
      - bearerAuth: []
    servers: *id009
  /api/missions/{missionId}/accept:
    post:
      tags:
      - mission
      summary: Accept a mission (creates the caller's assignment)
      parameters:
      - $ref: '#/components/parameters/mission_MissionId'
      responses:
        '201':
          description: Assignment created
          content:
            application/json:
              schema:
                type: object
                required:
                - assignment
                - mission
                - objectives
                properties:
                  assignment:
                    $ref: '#/components/schemas/mission_Assignment'
                  mission:
                    $ref: '#/components/schemas/mission_Mission'
                  objectives:
                    type: array
                    items:
                      $ref: '#/components/schemas/mission_Objective'
        '401':
          $ref: '#/components/responses/mission_Unauthorized'
        '404':
          $ref: '#/components/responses/mission_NotFound'
        '409':
          description: Mission not open, already assigned/completed, or full
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mission_Error'
              examples:
                full:
                  value:
                    error: MISSION_FULL
                    message: Mission has no free slot
                    status: 409
      security:
      - bearerAuth: []
    servers: *id009
  /api/missions/{missionId}/complete:
    post:
      tags:
      - mission
      summary: Complete the mission and settle its economic reward
      parameters:
      - $ref: '#/components/parameters/mission_MissionId'
      responses:
        '200':
          description: Completed assignment, mission and settlement outcome
          content:
            application/json:
              schema:
                type: object
                required:
                - assignment
                - mission
                properties:
                  assignment:
                    $ref: '#/components/schemas/mission_Assignment'
                  mission:
                    $ref: '#/components/schemas/mission_Mission'
                  settlement:
                    $ref: '#/components/schemas/mission_Settlement'
        '401':
          $ref: '#/components/responses/mission_Unauthorized'
        '404':
          $ref: '#/components/responses/mission_NotFound'
        '409':
          description: Objectives incomplete or assignment not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mission_Error'
        '502':
          description: Economy rejected the reward credit (assignment completed, reward unsettled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mission_Error'
      security:
      - bearerAuth: []
    servers: *id009
  /api/missions/{missionId}/objectives/{objectiveId}/progress:
    post:
      tags:
      - mission
      summary: Report progress on one objective (quantity delivered/transported)
      parameters:
      - $ref: '#/components/parameters/mission_MissionId'
      - $ref: '#/components/parameters/mission_ObjectiveId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - quantity
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  example: 5
      responses:
        '200':
          description: Updated objective and mission progress
          content:
            application/json:
              schema:
                type: object
                required:
                - objective
                - objectives
                - allComplete
                properties:
                  objective:
                    $ref: '#/components/schemas/mission_Objective'
                  objectives:
                    type: array
                    items:
                      $ref: '#/components/schemas/mission_Objective'
                  allComplete:
                    type: boolean
        '400':
          $ref: '#/components/responses/mission_ValidationError'
        '401':
          $ref: '#/components/responses/mission_Unauthorized'
        '404':
          $ref: '#/components/responses/mission_NotFound'
        '409':
          description: Objective locked, mission closed or assignment not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mission_Error'
              examples:
                locked:
                  value:
                    error: OBJECTIVE_LOCKED
                    message: Previous objectives must be completed first
                    status: 409
      security:
      - bearerAuth: []
    servers: *id009
  /api/profiles:
    get:
      tags:
      - social
      operationId: searchProfiles
      summary: Search profiles by display name
      parameters:
      - $ref: '#/components/parameters/social_search'
      - $ref: '#/components/parameters/social_limit'
      - name: entityType
        in: query
        required: false
        schema:
          oneOf:
          - $ref: '#/components/schemas/social_ProfileKind'
          - type: 'null'
        description: 'Restrict to players or NPCs (default: both).'
      responses:
        '200':
          description: Matching profiles, sorted by display name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/social_PlayerProfile'
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Sanctioned'
      security:
      - bearerAuth: []
    servers: *id001
  /api/profiles/{playerId}:
    get:
      tags:
      - social
      operationId: getProfile
      summary: Public profile with online status
      description: Location is not exposed here (friends only, see `/api/friends`).
      parameters:
      - $ref: '#/components/parameters/social_playerId'
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/social_PlayerProfile'
                - type: object
                  required:
                  - status
                  - corporations
                  properties:
                    status:
                      $ref: '#/components/schemas/social_PresenceStatus'
                    corporations:
                      type: array
                      items:
                        $ref: '#/components/schemas/social_CorporationRef'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Sanctioned'
        '404':
          $ref: '#/components/responses/social_NotFound'
      security:
      - bearerAuth: []
    servers: *id001
  /api/reports:
    post:
      tags:
      - social
      operationId: createReport
      summary: Report a player or a corporation
      description: Reporting a player costs them `REPUTATION_REPORT_PENALTY` (refunded if the report is dismissed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/social_CreateReport'
      responses:
        '201':
          description: Report filed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_Report'
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Sanctioned'
        '404':
          $ref: '#/components/responses/social_NotFound'
        '409':
          $ref: '#/components/responses/social_Conflict'
      security:
      - bearerAuth: []
    servers: *id001
    get:
      tags:
      - social
      operationId: listMyReports
      summary: Reports I filed
      parameters:
      - $ref: '#/components/parameters/social_limit'
      responses:
        '200':
          description: Reports, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/social_Report'
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Sanctioned'
      security:
      - bearerAuth: []
  /api/transfers:
    post:
      tags:
      - economie
      summary: Direct credits transfer to another player (automatic tax, payer side)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/economie_TransferBody'
      responses:
        '201':
          description: Transfer recorded (a tax may have been collected)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/economie_MovementResult'
        '400':
          $ref: '#/components/responses/economie_ValidationError'
        '401':
          $ref: '#/components/responses/economie_Unauthorized'
        '404':
          $ref: '#/components/responses/economie_NotFound'
        '409':
          description: Insufficient balance or already recorded `externalId` (`INSUFFICIENT_FUNDS` / `DUPLICATE_EXTERNAL_ID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/economie_Error'
        '403':
          $ref: '#/components/responses/economie_Forbidden'
      security:
      - bearerAuth: []
    servers: *id004
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Keycloak access token (RS256). The player id is the `sub` claim. Dev only (`AUTH_DEV_BYPASS=true`): `X-Player-Id`,
        `X-Player-Name`, `X-Player-Roles` headers.

        '
  schemas:
    mission_MissionStatus:
      type: string
      enum:
      - available
      - active
      - completed
      - cancelled
      - expired
    mission_MissionKind:
      type: string
      enum:
      - dynamic
      - scenario
      - player
    mission_MissionCategory:
      type: string
      enum:
      - delivery
      - transport
      - generic
    mission_MissionVisibility:
      type: string
      enum:
      - public
      - corporation
    mission_EscrowStatus:
      type: string
      enum:
      - none
      - pending
      - held
      - refunded
      - claimed
    mission_IssuerType:
      type: string
      enum:
      - system
      - corporation
      - city
      - player
    mission_ObjectiveType:
      type: string
      enum:
      - deliver_material
      - transport
      - visit
      - custom
    mission_ObjectiveStatus:
      type: string
      enum:
      - pending
      - in_progress
      - completed
      - failed
    mission_AssignmentStatus:
      type: string
      enum:
      - active
      - completed
      - abandoned
      - expired
    mission_Reward:
      type: object
      description: At least one of `economic` or `item` is required.
      properties:
        economic:
          type: object
          required:
          - currency
          - amount
          properties:
            currency:
              type: string
              default: credits
            amount:
              type: integer
              minimum: 1
        item:
          type: object
          required:
          - itemId
          - quantity
          properties:
            itemId:
              type: string
              description: Inventory good type
            quantity:
              type: integer
              minimum: 1
            instanceId:
              type: string
              format: uuid
              description: Unique-instance reward (single assignee only)
    mission_Mission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        kind:
          $ref: '#/components/schemas/mission_MissionKind'
        category:
          $ref: '#/components/schemas/mission_MissionCategory'
        issuerType:
          $ref: '#/components/schemas/mission_IssuerType'
        issuerId:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: '#/components/schemas/mission_MissionStatus'
        reward:
          $ref: '#/components/schemas/mission_Reward'
        visibility:
          $ref: '#/components/schemas/mission_MissionVisibility'
        maxAssignees:
          type: integer
        escrowStatus:
          $ref: '#/components/schemas/mission_EscrowStatus'
        escrowAmount:
          type: integer
          nullable: true
        escrowCurrency:
          type: string
          nullable: true
        escrowPayerId:
          type: string
          format: uuid
          nullable: true
        scriptId:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    mission_Objective:
      type: object
      properties:
        id:
          type: string
          format: uuid
        missionId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/mission_ObjectiveType'
        title:
          type: string
        description:
          type: string
          nullable: true
        targetQuantity:
          type: integer
        unit:
          type: string
          nullable: true
        locationFrom:
          type: object
          additionalProperties: true
          nullable: true
        locationTo:
          type: object
          additionalProperties: true
          nullable: true
        order:
          type: integer
        status:
          $ref: '#/components/schemas/mission_ObjectiveStatus'
        currentProgress:
          type: integer
        payload:
          type: object
          additionalProperties: true
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    mission_Assignment:
      type: object
      properties:
        id:
          type: string
