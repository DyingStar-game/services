      tags:
      - mission
      summary: Dry-run a mission spec (no persistence, no escrow)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/mission_ValidateMission'
      responses:
        '200':
          description: Spec is valid (normalized)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mission_ValidatedSpec'
        '400':
          description: 'Spec rejected (`MISSING_OBJECTIVES`, `REWARD_REQUIRED`, `UNKNOWN_OBJECTIVE_KIND`, `INVALID_OBJECTIVE_PARAMS`,
            `UNKNOWN_PREREQ_KIND`, `INVALID_PREREQUISITE_PARAMS`, `ITEM_REWARD_NOT_SPLITABLE`, `OBJECTIVE_NOT_IN_CATEGORY`,
            `PREREQ_NOT_IN_CATEGORY`)

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mission_Error'
        '401':
          $ref: '#/components/responses/mission_Unauthorized'
        '503':
          description: Item rewards require the Inventory service (`INVENTORY_NOT_CONFIGURED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mission_Error'
    servers:
    - url: http://mission:3000
      description: mission
  /api/missions/{missionId}:
    get:
      tags:
      - mission
