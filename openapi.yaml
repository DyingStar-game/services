      - $ref: '#/components/parameters/inventory_poiId'
      responses:
        '200':
          description: The POI and its grants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inventory_PoiView'
        '401':
          $ref: '#/components/responses/inventory_Unauthorized'
        '403':
          $ref: '#/components/responses/inventory_Forbidden'
        '404':
          $ref: '#/components/responses/inventory_NotFound'
        '503':
