      description: mission
  /api/missions/{missionId}/accept:
    post:
      tags:
      - mission
      summary: Accept a mission (creates the caller's assignment)
      parameters:
      - $ref: '#/components/parameters/mission_MissionId'
      responses:
        '201':
          description: Assignment created
          content:
            application/json:
              schema:
                type: object
                required:
                - assignment
                - mission
                - objectives
                properties:
                  assignment:
                    $ref: '#/components/schemas/mission_Assignment'
                  mission:
                    $ref: '#/components/schemas/mission_Mission'
                  objectives:
                    type: array
                    items:
                      $ref: '#/components/schemas/mission_Objective'
        '401':
          $ref: '#/components/responses/mission_Unauthorized'
        '403':
          description: 'Not allowed (`NOT_CORPORATION_MEMBER`, `NOT_GROUP_MEMBER`, `NO_GROUP`, `GROUP_ALREADY_CLAIMED`, `PREREQ_FAILED`,
            `OUT_OF_ZONE`)

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mission_Error'
              examples:
                prereq:
                  value:
                    error: PREREQ_FAILED
                    message: 'Prerequisite has_credits failed: balance 120 < 500 credits'
                    status: 403
                outOfZone:
                  value:
                    error: OUT_OF_ZONE
                    message: You are not in a zone where this mission is available
                    status: 403
        '404':
          $ref: '#/components/responses/mission_NotFound'
        '409':
          description: Mission not open, already assigned/completed, or full
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mission_Error'
              examples:
                full:
                  value:
                    error: MISSION_FULL
                    message: Mission has no free slot
                    status: 409
