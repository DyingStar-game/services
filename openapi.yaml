  /api/missions/{missionId}/share:
    post:
      tags:
      - mission
      summary: Share the mission with a group
      description: 'Restricts the mission to the members of the target group: they are the only ones to see and accept it,
        and it counts as taken by that group. Possible on any mission (public or corporation) by its creator or a member of
        the issuing corporation. Rejected while the mission has active assignees.

