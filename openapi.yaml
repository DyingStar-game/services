        '404':
          $ref: '#/components/responses/social_NotFound'
    servers:
    - url: http://social:3000
      description: social
  /api/reports:
    post:
      tags:
      - social
      operationId: createReport
      summary: Report a player or a corporation
      description: Reporting a player costs them `REPUTATION_REPORT_PENALTY` (refunded if the report is dismissed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/social_CreateReport'
      responses:
        '201':
