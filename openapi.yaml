openapi: 3.1.0
info:
  title: DyingStar — API joueur (mission, social, economie, inventory, market)
  version: 0.1.0
  description: 'Document agrege (fusion) des endpoints cote joueur des services mission, social, economie, inventory et market.
    Chaque service expose aussi sa propre spec sur GET /openapi.yaml.


    Authentification : JWT Keycloak (Authorization: Bearer, claim sub = player id). En dev uniquement, AUTH_DEV_BYPASS=true
    accepte X-Player-Id / X-Player-Name.


    Chaque operation porte son service (tag) et l''override `servers` du chemin : les services sont des processus distincts,
    avec le meme prefixe /api. Les routes /api/internal/* (serveur de jeu, tokens de service) et /api/admin/* ne sont pas
    couvertes.


    Erreurs : { error, message, status }.'
tags:
- name: public
  description: Non authentifie
- name: mission
  description: Service mission
  servers:
  - url: http://mission:3000
- name: social
  description: Service social
  servers:
  - url: http://social:3000
- name: economie
  description: Service economie
  servers:
  - url: http://economie:3000
- name: inventory
  description: Service inventory
  servers:
  - url: http://inventory:3000
- name: market
  description: Service market
  servers:
  - url: http://market:3000
security:
- bearerAuth: []
paths:
  /api/blocks:
    get:
      tags:
      - social
      operationId: listBlocks
      summary: Blocked players
      responses:
        '200':
          description: Blocked profiles with block date
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                  - $ref: '#/components/schemas/social_PlayerProfile'
                  - type: object
                    required:
                    - blockedAt
                    properties:
                      blockedAt:
                        type: string
                        format: date-time
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Sanctioned'
      security:
      - bearerAuth: []
    servers: &id001
    - &id006
      url: http://social:3000
      description: social
    - &id002
      url: http://economie:3000
      description: economie
    post:
      tags:
      - social
      operationId: blockPlayer
      summary: Block a player
      description: 'Drops any friendship or pending request between the two players, prevents new ones and costs the blocked
        player `REPUTATION_BLOCK_PENALTY` (refunded on unblock). Idempotent.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/social_TargetPlayer'
      responses:
        '204':
          description: Player blocked
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Sanctioned'
        '404':
          $ref: '#/components/responses/social_NotFound'
      security:
      - bearerAuth: []
  /api/blocks/{playerId}:
    delete:
      tags:
      - social
      operationId: unblockPlayer
      summary: Unblock a player
      parameters:
      - $ref: '#/components/parameters/social_playerId'
      responses:
        '204':
          description: Block removed
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Sanctioned'
        '404':
          $ref: '#/components/responses/social_NotFound'
      security:
      - bearerAuth: []
    servers: *id001
  /api/corporations:
    get:
      tags:
      - social
      operationId: listCorporations
      summary: Corporation directory
      parameters:
      - $ref: '#/components/parameters/social_search'
      - $ref: '#/components/parameters/social_limit'
      responses:
        '200':
          description: Corporations matching name or ticker, with member counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/social_CorporationSummary'
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Sanctioned'
      security:
      - bearerAuth: []
    servers: *id001
    post:
      tags:
      - social
      operationId: createCorporation
      summary: Create a corporation
      description: 'The caller becomes the CEO and holds the CEO rank. Default ranks are created: CEO (100, all permissions),
        Director (50: invite, recruit, manage_members), Member (0, default rank). A player belongs to at most one corporation.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/social_CreateCorporation'
      responses:
        '201':
          description: Corporation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_Corporation'
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Sanctioned'
        '409':
          description: Already in a corporation, or name/ticker already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_Error'
      security:
      - bearerAuth: []
  /api/corporations/{corporationId}:
    get:
      tags:
      - social
      operationId: getCorporation
      summary: Public corporation page
      responses:
        '200':
          description: Corporation with ranks and members (with presence)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/social_CorporationSummary'
                - type: object
                  required:
                  - ranks
                  - members
                  - parent
                  - subsidiaries
                  properties:
                    ranks:
                      type: array
                      items:
                        $ref: '#/components/schemas/social_CorporationRank'
                    members:
                      type: array
                      items:
                        $ref: '#/components/schemas/social_CorporationMember'
                    parent:
                      oneOf:
                      - $ref: '#/components/schemas/social_CorporationRef'
                      - type: 'null'
                    subsidiaries:
                      type: array
                      items:
                        $ref: '#/components/schemas/social_CorporationSummary'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Sanctioned'
        '404':
          $ref: '#/components/responses/social_NotFound'
      security:
      - bearerAuth: []
    servers: *id001
    patch:
      tags:
      - social
      operationId: updateCorporation
      summary: Edit a corporation
      description: Requires the `manage_corporation` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/social_CorporationPatch'
      responses:
        '200':
          description: Updated corporation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_Corporation'
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
        '404':
          $ref: '#/components/responses/social_NotFound'
        '409':
          $ref: '#/components/responses/social_Conflict'
      security:
      - bearerAuth: []
    delete:
      tags:
      - social
      operationId: disbandCorporation
      summary: Disband a corporation (CEO only)
      responses:
        '204':
          description: Corporation disbanded
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
        '404':
          $ref: '#/components/responses/social_NotFound'
      security:
      - bearerAuth: []
  /api/corporations/{corporationId}/activity:
    get:
      tags:
      - social
      operationId: getCorporationActivity
      summary: Internal corporation journal (members only)
      parameters:
      - $ref: '#/components/parameters/social_corporationId'
      - $ref: '#/components/parameters/social_limit'
      responses:
        '200':
          description: Journal entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/social_CorporationActivityEntry'
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
        '404':
          $ref: '#/components/responses/social_NotFound'
      security:
      - bearerAuth: []
    servers: *id001
  /api/corporations/{corporationId}/donations:
    post:
      tags:
      - economie
      summary: Donate credits from the member's wallet to the treasury
      parameters:
      - $ref: '#/components/parameters/economie_corporationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/economie_DonationBody'
      responses:
        '201':
          description: Donation recorded (internal tax stays in the corporation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/economie_MovementResult'
        '400':
          $ref: '#/components/responses/economie_ValidationError'
        '401':
          $ref: '#/components/responses/economie_Unauthorized'
        '403':
          description: Not a member, or donations disabled (`DONATIONS_DISABLED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/economie_Error'
        '409':
          $ref: '#/components/responses/economie_Conflict'
      security:
      - bearerAuth: []
    servers: &id004
    - *id002
  /api/corporations/{corporationId}/inventory:
    get:
      tags:
      - inventory
      summary: Corporation inventory (member only, membership checked in Social)
      parameters:
      - $ref: '#/components/parameters/inventory_corporationId'
      responses:
        '200':
          description: Inventory of the corporation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inventory_HolderInventory'
        '401':
          $ref: '#/components/responses/inventory_Unauthorized'
        '403':
          description: Not a member of this corporation (`NOT_CORPORATION_MEMBER`), or Social not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inventory_Error'
      security:
      - bearerAuth: []
    servers: &id003
    - &id007
      url: http://inventory:3000
      description: inventory
  /api/corporations/{corporationId}/inventory/stacks/{goodType}:
    get:
      tags:
      - inventory
      summary: One corporation stack (member only)
      parameters:
      - $ref: '#/components/parameters/inventory_corporationId'
      - $ref: '#/components/parameters/inventory_goodType'
      responses:
        '200':
          description: The stack
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inventory_StackView'
        '401':
          $ref: '#/components/responses/inventory_Unauthorized'
        '403':
          $ref: '#/components/responses/inventory_Forbidden'
        '404':
          $ref: '#/components/responses/inventory_NotFound'
      security:
      - bearerAuth: []
    servers: *id003
  /api/corporations/{corporationId}/invitations:
    post:
      tags:
      - social
      operationId: inviteToCorporation
      summary: Invite a player (`invite`)
      description: A pending application from that player is accepted instead (`200`).
      parameters:
      - $ref: '#/components/parameters/social_corporationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/social_TargetPlayer'
      responses:
        '200':
          description: Player joined the corporation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_JoinedResult'
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_PendingRequestResult'
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
        '404':
          $ref: '#/components/responses/social_NotFound'
        '409':
          description: Player already in a corporation, invitation already pending, or a block exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_Error'
      security:
      - bearerAuth: []
    servers: *id001
  /api/corporations/{corporationId}/join:
    post:
      tags:
      - social
      operationId: joinCorporation
      summary: Join directly (`open`) or apply (`apply`)
      description: A pending invitation from that corporation is accepted instead (`200`).
      parameters:
      - $ref: '#/components/parameters/social_corporationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Joined the corporation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_JoinedResult'
        '201':
          description: Application created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_PendingRequestResult'
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          description: Corporation is `closed`, or caller is sanctioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_Error'
        '404':
          $ref: '#/components/responses/social_NotFound'
        '409':
          description: Already in a corporation, or application already pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_Error'
      security:
      - bearerAuth: []
    servers: *id001
  /api/corporations/{corporationId}/members:
    get:
      tags:
      - economie
      - social
      operationId: listCorporationMembers
      summary: Members with rank and presence
      parameters:
      - $ref: '#/components/parameters/social_corporationId'
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/social_CorporationMember'
                - type: array
                  items:
                    $ref: '#/components/schemas/economie_CorporationMember'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Sanctioned'
        '404':
          $ref: '#/components/responses/social_NotFound'
      security:
      - bearerAuth: []
      description: Also served by economie on the same path.
    servers: *id001
  /api/corporations/{corporationId}/members/{playerId}:
    patch:
      tags:
      - social
      operationId: setCorporationMemberRank
      summary: Change a member's rank
      description: Requires `manage_members`; only ranks strictly below the actor's own may be given or taken.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rankId
              properties:
                rankId:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Updated membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_CorporationMembership'
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
        '404':
          $ref: '#/components/responses/social_NotFound'
      security:
      - bearerAuth: []
    servers: *id001
    delete:
      tags:
      - social
      operationId: removeCorporationMember
      summary: Leave (self) or kick (`manage_members`) a member
      description: The CEO cannot leave; transfer leadership or disband first.
      responses:
        '204':
          description: Member removed
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
        '404':
          $ref: '#/components/responses/social_NotFound'
      security:
      - bearerAuth: []
  /api/corporations/{corporationId}/members/{playerId}/prime:
    post:
      tags:
      - economie
      summary: Pay a one-off prime to a member from the treasury (leader/treasurer only)
      parameters:
      - $ref: '#/components/parameters/economie_corporationId'
      - $ref: '#/components/parameters/economie_playerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/economie_PrimeBody'
      responses:
        '201':
          description: Prime recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/economie_PrimeResult'
        '400':
          $ref: '#/components/responses/economie_ValidationError'
        '401':
          $ref: '#/components/responses/economie_Unauthorized'
        '403':
          $ref: '#/components/responses/economie_Forbidden'
        '404':
          description: The player is not a member of this corporation (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/economie_Error'
        '409':
          $ref: '#/components/responses/economie_Conflict'
      security:
      - bearerAuth: []
    servers: *id004
  /api/corporations/{corporationId}/parent:
    put:
      tags:
      - social
      operationId: setCorporationParent
      summary: Attach to a holding company, or detach (manage_corporation)
      description: 'Sets the corporation''s parent (making it a subsidiary of a holding company) or clears it with `parentId:
        null`. Refuses cycles (`409 CORPORATION_CYCLE`).

        '
      parameters:
      - $ref: '#/components/parameters/social_corporationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - parentId
              properties:
                parentId:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        '200':
          description: Updated corporation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_Corporation'
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
        '404':
          $ref: '#/components/responses/social_NotFound'
        '409':
          $ref: '#/components/responses/social_Conflict'
      security:
      - bearerAuth: []
    servers: *id001
  /api/corporations/{corporationId}/payroll:
    post:
      tags:
      - economie
      summary: Pay every member's salary now from the treasury (leader/treasurer only)
      parameters:
      - $ref: '#/components/parameters/economie_corporationId'
      - $ref: '#/components/parameters/economie_currencyQuery'
      responses:
        '200':
          description: Payout summary (atomic, aborted if the treasury is short)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/economie_PayrollResult'
        '401':
          $ref: '#/components/responses/economie_Unauthorized'
        '403':
          $ref: '#/components/responses/economie_Forbidden'
        '409':
          description: Treasury balance too low for the whole run (`INSUFFICIENT_FUNDS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/economie_Error'
      security:
      - bearerAuth: []
    servers: *id004
  /api/corporations/{corporationId}/ranks:
    get:
      tags:
      - social
      operationId: listCorporationRanks
      summary: Ranks, highest priority first
      responses:
        '200':
          description: Ranks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/social_CorporationRank'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Sanctioned'
        '404':
          $ref: '#/components/responses/social_NotFound'
      security:
      - bearerAuth: []
    servers: *id001
    post:
      tags:
      - social
      operationId: createCorporationRank
      summary: Create a rank (`manage_ranks`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/social_CreateRank'
      responses:
        '201':
          description: Rank created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_CorporationRank'
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
        '404':
          $ref: '#/components/responses/social_NotFound'
        '409':
          $ref: '#/components/responses/social_Conflict'
      security:
      - bearerAuth: []
  /api/corporations/{corporationId}/ranks/{rankId}:
    patch:
      tags:
      - social
      operationId: updateCorporationRank
      summary: Edit a rank (`manage_ranks`)
      description: The CEO rank only accepts a rename.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/social_RankPatch'
      responses:
        '200':
          description: Updated rank
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/social_CorporationRank'
        '400':
          $ref: '#/components/responses/social_ValidationError'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
        '404':
          $ref: '#/components/responses/social_NotFound'
        '409':
          $ref: '#/components/responses/social_Conflict'
      security:
      - bearerAuth: []
    servers: *id001
    delete:
      tags:
      - social
      operationId: deleteCorporationRank
      summary: Delete a rank (`manage_ranks`)
      description: Members holding it are moved to the default rank. The CEO and default ranks cannot be deleted.
      responses:
        '204':
          description: Rank deleted
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
        '404':
          $ref: '#/components/responses/social_NotFound'
        '409':
          $ref: '#/components/responses/social_Conflict'
      security:
      - bearerAuth: []
  /api/corporations/{corporationId}/report:
    get:
      tags:
      - economie
      summary: Financial report (leader/treasurer only)
      parameters:
      - $ref: '#/components/parameters/economie_corporationId'
      - $ref: '#/components/parameters/economie_from'
      - $ref: '#/components/parameters/economie_to'
      responses:
        '200':
          description: Totals and breakdown by transaction type and currency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/economie_CorporationReport'
        '400':
          $ref: '#/components/responses/economie_ValidationError'
        '401':
          $ref: '#/components/responses/economie_Unauthorized'
        '403':
          $ref: '#/components/responses/economie_Forbidden'
      security:
      - bearerAuth: []
    servers: *id004
  /api/corporations/{corporationId}/requests:
    get:
      tags:
      - social
      operationId: listCorporationRequests
      summary: Pending applications and invitations (`recruit` or `invite`)
      parameters:
      - $ref: '#/components/parameters/social_corporationId'
      responses:
        '200':
          description: Requests with the player's profile
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/social_CorporationRequest'
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
          $ref: '#/components/responses/social_Forbidden'
        '404':
          $ref: '#/components/responses/social_NotFound'
      security:
      - bearerAuth: []
    servers: *id001
  /api/corporations/{corporationId}/requests/{id}/accept:
    post:
      tags:
      - social
      operationId: acceptCorporationApplication
      summary: Accept an application (`recruit`)
      parameters:
      - $ref: '#/components/parameters/social_corporationId'
      - $ref: '#/components/parameters/social_requestId'
      responses:
        '204':
          description: Player added to the corporation
        '401':
          $ref: '#/components/responses/social_Unauthorized'
        '403':
