  food_slurry:
    name: "Slurry"
    nickname: "La slurry"
    unit: tube
    unit_kg: 0.15
    price: 2
    made_by: factory
    composition:
      - { part: "Protéine d'insecte concentrée", pct: 25, ingredient: raw_insect }
      - { part: "Nutri-gris (algues)", pct: 32, ingredient: raw_algae }
      - { part: "Nutri-gris (eau)", pct: 4, ingredient: water }
      - { part: "Nutri-gris (additifs)", pct: 4, ingredient: food_additives }
      - { part: "Lipides végétaux", pct: 5, ingredient: raw_legume }
      - { part: "Humectants et épaississants", pct: 15, ingredient: food_additives }
      - { part: "Fibres alimentaires solubles", pct: 5, ingredient: raw_cereal }
      - { part: "Arômes et épices synthétiques", pct: 7, ingredient: food_additives }
      - { part: "Conservateurs et antioxydants", pct: 3, ingredient: food_additives }

# Units eaten per person and per planetary day, by diet. A role picks its diet in its
# archetype (`diet:`); roles without one eat `worker`. Pages: Slurry is "popular in mining
# villages", Galet compressé is for "mine shaft workers", Bloc de bouillon is the base soup of
# "canteens and dormitories", Craquelins are the bottom ration of "Ouvriers", Nutri-gris is
# served plain to "Intérimaires", Noodles and Conserves are "for ARES executives".
diets:
  mine:          # mine-side crews: eat on the move during the shift
    food_slurry: 2
    food_compressed_pebble: 1
    food_broth_cube: 1
    food_nutri_grey: 1
    food_crackers: 1
    food_vita_c_juice: 1
  worker:        # every other worker
    food_energy_bar: 2
    food_broth_cube: 1
    food_nutri_grey: 1
    food_crackers: 1
    food_vita_c_juice: 1
  executive:     # ARES executives: director, shift bosses, agronomists, geologists
    food_vita_noodles: 2
    food_legume_can: 1
    food_energy_bar: 1
    food_vita_c_juice: 1
  dependant:     # children, retired, refugees
    food_broth_cube: 2
    food_nutri_grey: 1
    food_crackers: 1
    food_vita_c_juice: 1
# Eaten by every adult on top of the diet (independent shops, bar).
extras:
  food_mushroom_concentrate: 0.1
  food_porcini_liqueur: 0.05
