# Food of Sandbox (tarsis_3): the consumables of the narrative design, what they are made of,
# and who eats what (ADR services/0009).
#
# Source: developer.dyingstar-game.com, Narrative Design > Équipements & consommables >
# Consommables (one page per item). Compositions are the pages' mass percentages; each line is
# mapped to an ingredient resource:
#   raw_algae     cultivated algae (Nutri-gris base, "synthetic" proteins and culture oils)
#   raw_insect    insect flour and protein
#   raw_legume    legumes and oil crops (vegetable lipids, plant proteins)
#   raw_cereal    cereals (flours, starches, fibres, sugars, yeast)
#   raw_mushroom  Sandbox mushrooms
#   food_salts      salts and minerals, by-products of the regolith processed for water on
#                   moon 2 (tarsis_3_2, ADR services/0011)
#   food_additives  preservatives, flavourings, colourings, synthetic vitamins, humectants and
#                   binders: chemistry, imported from outside the system
#   water           from moon 2 as well (ADR services/0011)
# The five raw_* come from the farm villages (ADR services/0010); unit masses and portions are
# design assumptions (the pages give none).
# "Eau gélifiée" is not listed: its page is still an empty template.

ingredients:
  raw_algae: { name: "Cultivated algae", origin: farm, value: bon marché }
  raw_insect: { name: "Insect flour", origin: farm, value: bon marché }
  raw_legume: { name: "Legumes and oil crops", origin: farm, value: bon marché }
  raw_cereal: { name: "Cereals", origin: farm, value: bon marché }
  raw_mushroom: { name: "Sandbox mushrooms", origin: farm, value: normal }
  food_salts: { name: "Mineral salts", origin: moon, value: bon marché }
  food_additives: { name: "Food additives", origin: import, value: normal }
  water: { name: "Water", origin: moon }

# made_by: factory (ARES Distribution, made in the factories) | farm (civilian production in
# the farm villages). unit_kg: mass of one unit (bar, cube, can…). price: credits per unit.
consumables:
  food_energy_bar:
    name: "Barre énergétique"
    nickname: "Barre de sève"
    unit: bar
    unit_kg: 0.08
    price: 3
    made_by: factory
    composition:
      - { part: "Protéines synthétiques hydrolysées", pct: 40, ingredient: raw_algae }
      - { part: "Farine d'insectes", pct: 15, ingredient: raw_insect }
      - { part: "Humectants et liants", pct: 15, ingredient: food_additives }
      - { part: "Lipides végétaux raffinés", pct: 10, ingredient: raw_legume }
      - { part: "Fibres alimentaires solubles", pct: 5, ingredient: raw_cereal }
      - { part: "Micronutriments enrichis", pct: 5, ingredient: food_additives }
      - { part: "Arômes artificiels neutres et stabilisants", pct: 5, ingredient: food_additives }
      - { part: "Antioxydants et conservateurs", pct: 5, ingredient: food_additives }
  food_broth_cube:
    name: "Bloc de bouillon concentré"
    unit: cube
    unit_kg: 0.04
    price: 2
    made_by: factory
    composition:
      - { part: "Poudre de Nutri-gris déshydratée", pct: 55, ingredient: raw_algae }
      - { part: "Sels de conservation", pct: 20, ingredient: food_salts }
      - { part: "Exhausteurs de goût", pct: 10, ingredient: food_additives }
      - { part: "Arômes artificiels", pct: 5, ingredient: food_additives }
      - { part: "Fibres et amidons modifiés", pct: 5, ingredient: raw_cereal }
      - { part: "Conservateurs et antioxydants", pct: 5, ingredient: food_additives }
  food_mushroom_concentrate:
    name: "Concentré liquide de champignons"
    unit: jar
    unit_kg: 0.1
    price: 6
    made_by: farm
    composition:
      - { part: "Extrait de champignons de Sandbox", pct: 65, ingredient: raw_mushroom }
      - { part: "Eau résiduelle", pct: 15, ingredient: water }
      - { part: "Extrait de levure", pct: 6, ingredient: raw_cereal }
      - { part: "Sel et assaisonnements naturels", pct: 6, ingredient: raw_cereal }
      - { part: "Huile neutre", pct: 8, ingredient: raw_legume }
  food_legume_can:
    name: "Conserve de légumineuses"
    unit: can
    unit_kg: 0.4
    price: 12
    made_by: factory
    composition:
      - { part: "Légumineuses entières", pct: 60, ingredient: raw_legume }
      - { part: "Huile de culture synthétique", pct: 25, ingredient: raw_algae }
      - { part: "Eau", pct: 5, ingredient: water }
      - { part: "Sels et conservateurs", pct: 5, ingredient: food_salts }
      - { part: "Fibres et agents de texture", pct: 3, ingredient: raw_cereal }
      - { part: "Micronutriments synthétiques", pct: 2, ingredient: food_additives }
  food_crackers:
    name: "Craquelins"
    unit: pack
    unit_kg: 0.1
    price: 1
    made_by: factory
    composition:
      - { part: "Farines de basse qualité", pct: 55, ingredient: raw_cereal }
      - { part: "Fibres recyclées", pct: 20, ingredient: raw_cereal }
      - { part: "Amidon liant et agents levants", pct: 8, ingredient: raw_cereal }
      - { part: "Sel de conservation", pct: 5, ingredient: food_salts }
      - { part: "Eau", pct: 5, ingredient: water }
      - { part: "Graisses végétales hydrogénées", pct: 5, ingredient: raw_legume }
      - { part: "Antioxydants et conservateurs", pct: 2, ingredient: food_additives }
  food_compressed_pebble:
    name: "Galet compressé"
    unit: disc
    unit_kg: 0.15
    price: 3
    made_by: factory
    composition:
      - { part: "Glucides complexes à libération lente", pct: 70, ingredient: raw_cereal }
      - { part: "Protéines végétales concentrées", pct: 10, ingredient: raw_legume }
      - { part: "Agents liants et durcissants", pct: 15, ingredient: food_additives }
      - { part: "Lipides neutres", pct: 3, ingredient: raw_legume }
      - { part: "Vitamines et minéraux synthétiques", pct: 2, ingredient: food_additives }
  food_vita_c_juice:
    name: "Jus Vita-C"
    unit: sachet
    unit_kg: 0.2
    price: 2
    made_by: factory
    composition:
      - { part: "Concentré sucré", pct: 70, ingredient: raw_cereal }
      - { part: "Eau purifiée", pct: 15, ingredient: water }
      - { part: "Arômes et colorants artificiels", pct: 5, ingredient: food_additives }
      - { part: "Vitamines et minéraux synthétiques", pct: 5, ingredient: food_additives }
      - { part: "Acidifiant et stabilisant", pct: 2, ingredient: food_additives }
      - { part: "Conservateurs", pct: 3, ingredient: food_additives }
  food_porcini_liqueur:
    name: "Liqueur de cèpes"
    unit: bottle
    unit_kg: 0.5
    price: 15
    made_by: farm
    legal: toléré
    composition:
      - { part: "Extrait de champignons de Sandbox", pct: 70, ingredient: raw_mushroom }
      - { part: "Eau", pct: 15, ingredient: water }
      - { part: "Sucres et sirops fermentescibles", pct: 10, ingredient: raw_cereal }
      - { part: "Levure de fermentation", pct: 5, ingredient: raw_cereal }
  food_vita_noodles:
    name: "Nouilles séchées Vita-Noodles"
    unit: cake
    unit_kg: 0.1
    price: 8
    made_by: factory
    composition:
      - { part: "Farines de céréales complètes et levure", pct: 50, ingredient: raw_cereal }
      - { part: "Protéine d'insecte raffinée", pct: 25, ingredient: raw_insect }
      - { part: "Amidon et agents liants", pct: 10, ingredient: raw_cereal }
      - { part: "Lipides neutres", pct: 5, ingredient: raw_legume }
      - { part: "Arômes artificiels", pct: 5, ingredient: food_additives }
      - { part: "Micronutriments synthétiques", pct: 3, ingredient: food_additives }
      - { part: "Conservateurs", pct: 2, ingredient: food_additives }
  food_nutri_grey:
    name: "Nutri-Gris"
    nickname: "Le gruau"
    unit: brick
    unit_kg: 0.4
    price: 1
    made_by: factory
    composition:
      - { part: "Souche d'algues cultivées", pct: 80, ingredient: raw_algae }
      - { part: "Eau", pct: 10, ingredient: water }
      - { part: "Humectants et liants", pct: 5, ingredient: food_additives }
      - { part: "Micronutriments synthétiques", pct: 3, ingredient: food_additives }
